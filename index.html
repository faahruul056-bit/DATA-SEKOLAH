<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Informasi Data SMP Angkasa (SIDSA)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // CEK SESSION LOGIN (REDIRECT KE LOGIN.HTML JIKA BELUM LOGIN)
    const currentSession = JSON.parse(localStorage.getItem('sidsa_session_v10'));
    if (!currentSession) {
      window.location.href = 'login.html';
    }

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0052cc',
              blueDark: '#003d99',
              blueLight: '#e6f0ff',
              orange: '#ffab00',
              grayBg: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-grayBg font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- TOP HEADER -->
  <header class="bg-brand-blue text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-2 rounded-lg text-brand-blue font-bold text-xl shadow">
          <i data-lucide="graduation-cap" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight tracking-wide">SIDSA</h1>
          <p class="text-xs text-blue-200">Sistem Informasi Data SMP Angkasa</p>
        </div>
      </div>

      <div class="flex items-center gap-3" id="topHeaderRightControls">
        <!-- User Badge & Action Buttons Injected via JS -->
      </div>
    </div>
  </header>

  <div class="flex flex-1 max-w-7xl w-full mx-auto px-4 py-6 gap-6">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 hidden md:block">
      <div class="mb-4 px-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Menu Utama</div>
      <nav class="space-y-1" id="sidebarMenu"></nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 space-y-6 overflow-hidden">

      <!-- GLOBAL FILTER BAR -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-3" id="filterControlsContainer">
          <!-- Dynamic Filter Controls -->
        </div>

        <div class="flex items-center gap-2">
          <button onclick="exportToExcel()" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
          </button>
          <button onclick="window.print()" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition">
            <i data-lucide="printer" class="w-4 h-4"></i> Cetak / PDF
          </button>
        </div>
      </div>

      <!-- PAGE CONTENT CONTAINER -->
      <div id="pageContent"></div>

    </main>
  </div>

  <!-- MODAL TAMBAH TAHUN AJARAN BARU (KHUSUS ADMIN) -->
  <div id="addTaModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <i data-lucide="calendar-plus" class="w-4 h-4 text-brand-blue"></i> Tambah Tahun Ajaran Baru
        </h3>
        <button onclick="closeAddTaModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleAddNewTA(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-600 mb-1">Tahun Ajaran Baru</label>
          <input type="text" id="newTaInput" required placeholder="Contoh: 2027/2028" class="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-blue font-semibold">
          <p class="text-[10px] text-slate-400 mt-1">Format: YYYY/YYYY (misal: 2027/2028)</p>
        </div>
        <div class="flex justify-end gap-2 border-t pt-3">
          <button type="button" onclick="closeAddTaModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-2 rounded-lg">Batal</button>
          <button type="submit" class="bg-brand-blue hover:bg-brand-blueDark text-white font-bold px-4 py-2 rounded-lg shadow">Tambah Tahun Ajaran</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DETAIL ISIAN LENGKAP SEKOLAH -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Detail Ringkasan Input Data Sekolah</h3>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="modalBody" class="text-xs space-y-3 max-h-96 overflow-y-auto">
        <!-- Content Injected Dynamically -->
      </div>
      <div class="text-right border-t pt-3">
        <button onclick="closeDetailModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-lg text-xs">Tutup</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const docsConfig = [
      { key: 'rkas', label: 'RKAS' },
      { key: 'rpss', label: 'RPSS' },
      { key: 'raporPendidikan', label: 'Rapor Pendidikan Sekolah' },
      { key: 'mpls', label: 'Hasil Laporan MPLS' },
      { key: 'kaldik', label: 'Kalender Pendidikan Sekolah' },
      { key: 'sarpras', label: 'Data Sarana dan Prasarana' },
      { key: 'medsos', label: 'Laporan Perkembangan Media Sosial' },
      { key: 'jadwalPelajaran', label: 'Jadwal Pelajaran' },
      { key: 'skPembagianTugas', label: 'SK Pembagian Tugas' }
    ];

    // DATABASE KOSONGAN (HANYA DIMULAI DARI TAHUN AJARAN 2026/2027)
    const initialData = {
      "2026/2027": []
    };

    let activeTab = 'dashboard';
    let db = JSON.parse(localStorage.getItem('sidsa_db_v10')) || initialData;

    // TIKAN DATABASE SELALU MEMILIKI KUNCI TAHUN AJARAN 2026/2027
    if (!db["2026/2027"]) {
      db["2026/2027"] = [];
    }

    function saveDB() {
      localStorage.setItem('sidsa_db_v10', JSON.stringify(db));
    }

    function resetDataDemo() {
      if (confirm("Reset akan mengembalikan seluruh database ke keadaan kosong bawaan. Lanjutkan?")) {
        localStorage.removeItem('sidsa_db_v10');
        localStorage.removeItem('sidsa_users_v10');
        localStorage.removeItem('sidsa_session_v10');
        alert("Database berhasil di-reset. Silakan login kembali!");
        window.location.href = 'login.html';
      }
    }

    function handleLogout() {
      if (confirm("Apakah Anda yakin ingin keluar dari aplikasi?")) {
        localStorage.removeItem('sidsa_session_v10');
        window.location.href = 'login.html';
      }
    }

    function parseRoleInfo() {
      if (currentSession.role === 'SEKOLAH') {
        return { role: 'SEKOLAH', npsn: currentSession.npsn };
      }
      return { role: currentSession.role, npsn: null };
    }

    function renderHeaderControls() {
      const container = document.getElementById('topHeaderRightControls');
      const isAdmin = currentSession.role === 'ADMIN';

      container.innerHTML = `
        ${isAdmin ? `
          <button onclick="resetDataDemo()" class="text-xs font-semibold bg-blue-800 hover:bg-blue-700 text-blue-200 hover:text-white px-2.5 py-1.5 rounded-lg border border-blue-400/30 transition flex items-center gap-1">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Database
          </button>
        ` : ''}

        <div class="bg-blue-900/60 px-3 py-1.5 rounded-lg border border-blue-400/30 text-xs flex items-center gap-2">
          <i data-lucide="user-check" class="w-4 h-4 text-brand-orange"></i>
          <div>
            <span class="font-bold block" id="sessionUserName">${currentSession.nama}</span>
            <span class="text-[10px] text-blue-200 block" id="sessionUserRole">${currentSession.role === 'SEKOLAH' ? `Sekolah (NPSN: ${currentSession.npsn})` : currentSession.role}</span>
          </div>
        </div>

        <button onclick="handleLogout()" class="text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar
        </button>
      `;
    }

    window.onload = function() {
      renderHeaderControls();
      renderSidebar();
      renderFilterControls();
      renderPage('dashboard');
      lucide.createIcons();
    };

    const menuItems = [
      { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'identitas', label: 'Identitas & Legalitas', icon: 'school', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'peserta_didik', label: 'Peserta Didik & Rombel', icon: 'users', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'pendidik_tendik', label: 'Pendidik & Tendik', icon: 'user-check', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'keuangan', label: 'Data Keuangan', icon: 'wallet', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'dokumen_tambahan', label: 'Dokumen & Laporan', icon: 'file-text', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'analisis', label: 'Analisis & Insight', icon: 'bar-chart-3', roles: ['ADMIN', 'VIEWER'] },
      { id: 'validasi', label: 'Validasi Data', icon: 'check-square', roles: ['ADMIN'] },
      { id: 'laporan', label: 'Rekap Laporan', icon: 'download', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'pengaturan_password', label: 'Ubah Password Akun', icon: 'key-round', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] }
    ];

    function renderSidebar() {
      const container = document.getElementById('sidebarMenu');
      container.innerHTML = '';
      const { role } = parseRoleInfo();

      menuItems.forEach(item => {
        if (item.roles.includes(role)) {
          const isActive = activeTab === item.id;
          const btn = document.createElement('button');
          btn.onclick = () => { activeTab = item.id; renderSidebar(); renderPage(item.id); };
          btn.className = `w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-xs font-bold transition ${
            isActive ? 'bg-brand-blue text-white shadow' : 'text-slate-600 hover:bg-slate-100'
          }`;
          btn.innerHTML = `<i data-lucide="${item.icon}" class="w-4 h-4"></i> <span>${item.label}</span>`;
          container.appendChild(btn);
        }
      });
      lucide.createIcons();
    }

    function renderFilterControls() {
      const container = document.getElementById('filterControlsContainer');
      const { role, npsn } = parseRoleInfo();
      const isAdmin = role === 'ADMIN';

      // AMBIL SEMUA KUNCI TAHUN AJARAN YANG TERSEDIA
      const taList = Object.keys(db).sort().reverse();
      const selectedTA = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";

      const taOptionsHtml = taList.map(ta => `<option value="${ta}" ${ta === selectedTA ? 'selected' : ''}>${ta}</option>`).join('');

      if (role === 'SEKOLAH') {
        const currentSchool = db[selectedTA]?.find(s => s.npsn === npsn);
        const schoolName = currentSchool ? currentSchool.nama : currentSession.nama;

        container.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Tahun Ajaran</label>
            <select id="filterTA" onchange="applyFilters()" class="text-xs font-semibold border border-slate-300 rounded-md p-2 bg-slate-50 focus:ring-2 focus:ring-brand-blue outline-none">
              ${taOptionsHtml}
            </select>
          </div>
          <div class="self-end pb-2">
            <span class="text-xs font-bold bg-blue-100 text-brand-blue px-3 py-1.5 rounded-md border border-blue-200">
              Akses Terkunci: ${schoolName}
            </span>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Tahun Ajaran</label>
            <div class="flex items-center gap-2">
              <select id="filterTA" onchange="applyFilters()" class="text-xs font-semibold border border-slate-300 rounded-md p-2 bg-slate-50 focus:ring-2 focus:ring-brand-blue outline-none">
                ${taOptionsHtml}
              </select>
              ${isAdmin ? `
                <button onclick="openAddTaModal()" class="text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-2 rounded-md shadow transition flex items-center gap-1" title="Tambah Tahun Ajaran Baru">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> TA Baru
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function openAddTaModal() {
      document.getElementById('addTaModal').classList.remove('hidden');
    }

    function closeAddTaModal() {
      document.getElementById('addTaModal').classList.add('hidden');
      document.getElementById('newTaInput').value = '';
    }

    function handleAddNewTA(e) {
      e.preventDefault();
      const newTA = document.getElementById('newTaInput').value.trim();

      if (!newTA) return;

      if (db[newTA]) {
        alert(`Tahun Ajaran ${newTA} sudah ada di sistem!`);
        return;
      }

      // BUAT ARRAY KOSONG UNTUK TAHUN AJARAN BARU
      db[newTA] = [];

      // OTOMATIS COPY IDENTITAS SEKOLAH DARI TAHUN AJARAN TERAKHIR SUPAYA OPERATOR TIDAK KETIK ULANG NAMA & NPSN
      const latestTA = Object.keys(db).sort().reverse()[1]; // TA sebelum yang baru
      if (latestTA && db[latestTA].length > 0) {
        db[newTA] = db[latestTA].map(s => ({
          npsn: s.npsn,
          nama: s.nama,
          cabang: s.cabang,
          akreditasi: s.akreditasi || "A",
          tahunAkreditasi: s.tahunAkreditasi || "",
          kepalaSekolah: s.kepalaSekolah || "",
          statusValidation: "Belum Mengisi",
          lastUpdate: new Date().toISOString().split('T')[0],
          legalitas: {
            skPendirian: s.legalitas?.skPendirian || "-",
            tglSK: s.legalitas?.tglSK || "-",
            skIzin: s.legalitas?.skIzin || "-",
            tglSKIzin: s.legalitas?.tglSKIzin || "-"
          },
          siswa: { k7L: 0, k7P: 0, r7: 0, k8L: 0, k8P: 0, r8: 0, k9L: 0, k9P: 0, r9: 0 },
          pendidik: { L: 0, P: 0, gty: 0, cgty: 0, dpkPns: 0 },
          tendik: { L: 0, P: 0, kty: 0, ckty: 0 },
          keuangan: { dopUmum7: 0, dopUmum8: 0, dopUmum9: 0, dopTniau7: 0, dopTniau8: 0, dopTniau9: 0, dspGel1: 0, dspGel2: 0, dspGel3: 0 },
          dokumenLaporan: {
            rkas: { status: "Belum Mengisi", notes: "", fileName: "" },
            rpss: { status: "Belum Mengisi", notes: "", fileName: "" },
            raporPendidikan: { status: "Belum Mengisi", notes: "", fileName: "" },
            mpls: { status: "Belum Mengisi", notes: "", fileName: "" },
            kaldik: { status: "Belum Mengisi", notes: "", fileName: "" },
            sarpras: { status: "Belum Mengisi", notes: "", fileName: "" },
            medsos: { status: "Belum Mengisi", notes: "", fileName: "" },
            jadwalPelajaran: { status: "Belum Mengisi", notes: "", fileName: "" },
            skPembagianTugas: { status: "Belum Mengisi", notes: "", fileName: "" }
          }
        }));
      }

      saveDB();
      alert(`Tahun Ajaran ${newTA} Berhasil Ditambahkan!\n\nTahun Ajaran baru ini sekarang sudah otomatis muncul di pilihan dropdown untuk seluruh Operator Sekolah.`);
      closeAddTaModal();
      renderFilterControls();
      document.getElementById('filterTA').value = newTA;
      applyFilters();
    }

    function applyFilters() {
      renderPage(activeTab);
    }

    function getFilteredData() {
      const taList = Object.keys(db).sort().reverse();
      const ta = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";
      let list = db[ta] || [];
      const { role, npsn } = parseRoleInfo();

      if (role === 'SEKOLAH') {
        list = list.filter(s => s.npsn === npsn);
      }
      return list;
    }

    function calcStats(list) {
      let totalSekolah = list.length;
      let totalSiswa = 0;
      let totalRombel = 0;
      let totalPendidik = 0;
      let totalTendik = 0;
      let totalDOPBulan = 0;

      list.forEach(s => {
        const sSiswa = (s.siswa.k7L + s.siswa.k7P) + (s.siswa.k8L + s.siswa.k8P) + (s.siswa.k9L + s.siswa.k9P);
        const sRombel = s.siswa.r7 + s.siswa.r8 + s.siswa.r9;
        const sPendidik = s.pendidik.L + s.pendidik.P;
        const sTendik = s.tendik.L + s.tendik.P;

        const k7Tot = s.siswa.k7L + s.siswa.k7P;
        const k8Tot = s.siswa.k8L + s.siswa.k8P;
        const k9Tot = s.siswa.k9L + s.siswa.k9P;

        const dop7 = (s.keuangan?.dopUmum7 || 0) + (s.keuangan?.dopTniau7 || 0);
        const dop8 = (s.keuangan?.dopUmum8 || 0) + (s.keuangan?.dopTniau8 || 0);
        const dop9 = (s.keuangan?.dopUmum9 || 0) + (s.keuangan?.dopTniau9 || 0);

        const dopBln = (k7Tot * dop7) + (k8Tot * dop8) + (k9Tot * dop9);

        totalSiswa += sSiswa;
        totalRombel += sRombel;
        totalPendidik += sPendidik;
        totalTendik += sTendik;
        totalDOPBulan += dopBln;
      });

      return {
        totalSekolah, totalSiswa, totalRombel, totalPendidik, totalTendik, totalDOPBulan,
        rasioGuruSiswa: totalPendidik ? (totalSiswa / totalPendidik).toFixed(1) : 0
      };
    }

    function formatRupiah(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
    }

    function getAkreditasiText(akred) {
      if (akred === 'A') return 'A (Predikat Unggul)';
      if (akred === 'B') return 'B (Predikat Sangat Baik)';
      if (akred === 'C') return 'C (Predikat Baik)';
      if (akred === 'D') return 'D (Tidak Terakreditasi)';
      return akred || '-';
    }

    function renderStatusBadge(status) {
      if (status === 'Sudah Valid' || status === 'Valid') {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300"><i data-lucide="check-circle" class="w-3 h-3 text-emerald-600"></i> Valid</span>`;
      } else if (status === 'Perlu Perbaikan' || status === 'Belum Mengisi') {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-300"><i data-lucide="alert-triangle" class="w-3 h-3 text-rose-600"></i> ${status}</span>`;
      } else {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300"><i data-lucide="clock" class="w-3 h-3 text-amber-600"></i> ${status}</span>`;
      }
    }

    function renderPage(page) {
      const container = document.getElementById('pageContent');
      const list = getFilteredData();
      const stats = calcStats(list);

      if (page === 'dashboard') {
        container.innerHTML = `
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-blue-100 text-brand-blue rounded-lg"><i data-lucide="school" class="w-6 h-6"></i></div>
              <div><p class="text-xs text-slate-500 font-semibold">Total Sekolah Terdaftar</p><h3 class="text-xl font-black text-slate-800">${stats.totalSekolah}</h3></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-amber-100 text-amber-600 rounded-lg"><i data-lucide="users" class="w-6 h-6"></i></div>
              <div><p class="text-xs text-slate-500 font-semibold">Total Peserta Didik</p><h3 class="text-xl font-black text-slate-800">${stats.totalSiswa}</h3></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i data-lucide="user-check" class="w-6 h-6"></i></div>
              <div><p class="text-xs text-slate-500 font-semibold">Rasio Guru : Siswa</p><h3 class="text-xl font-black text-slate-800">1 : ${stats.rasioGuruSiswa}</h3></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-indigo-100 text-indigo-600 rounded-lg"><i data-lucide="wallet" class="w-6 h-6"></i></div>
              <div><p class="text-xs text-slate-500 font-semibold">Total DOP Bulanan</p><h3 class="text-lg font-black text-slate-800">${formatRupiah(stats.totalDOPBulan)}</h3></div>
            </div>
          </div>

          ${list.length === 0 ? `
            <div class="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-2">
              <i data-lucide="folder-open" class="w-12 h-12 text-slate-300 mx-auto"></i>
              <h4 class="font-bold text-slate-700 text-sm">Belum Ada Data Sekolah Terdaftar di Tahun Ajaran Ini</h4>

            </div>

              <input type="password" id="confirmNewPassword" required placeholder="Ketik ulang kata sandi baru" class="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-blue font-medium">
            </div>

            <button type="submit" class="w-full bg-brand-blue hover:bg-brand-blueDark text-white font-bold py-2.5 rounded-lg shadow transition text-xs">

            </button>
          </form>
        </div>
      `;
    }

    function handleUpdatePassword(e) {
      e.preventDefault();
      const oldPass = document.getElementById('oldPassword').value.trim();
      const newPass = document.getElementById('newPassword').value.trim();
      const confirmPass = document.getElementById('confirmNewPassword').value.trim();

      if (oldPass !== currentSession.pass) {
        alert("Kata Sandi Lama yang Anda masukkan salah!");
        return;
      }

      if (newPass !== confirmPass) {
        alert("Konfirmasi Kata Sandi Baru tidak cocok!");
        return;
      }

      if (newPass.length < 4) {
        alert("Kata Sandi Baru minimal terdiri dari 4 karakter!");
        return;
      }

      let usersDB = JSON.parse(localStorage.getItem('sidsa_users_v10')) || [];
      const userIndex = usersDB.findIndex(u => u.user.toLowerCase() === currentSession.user.toLowerCase());

      if (userIndex !== -1) {
        usersDB[userIndex].pass = newPass;
        localStorage.setItem('sidsa_users_v10', JSON.stringify(usersDB));

        currentSession.pass = newPass;
        localStorage.setItem('sidsa_session_v10', JSON.stringify(currentSession));

        alert("Kata Sandi Berhasil Diperbarui! Silakan gunakan kata sandi baru ini untuk login berikutnya.");
        renderPage('dashboard');
      }
    }

                </p>
              </div>

              <div class="bg-emerald-50/70 border border-emerald-200 p-4 rounded-xl space-y-2">
                <span class="font-bold text-emerald-800 text-sm flex items-center gap-1.5 border-b border-emerald-200 pb-1.5">
                  <i data-lucide="user-check" class="w-4 h-4"></i> 2. Efisiensi & Kemandirian SDM
                </span>
                <p>• <strong>Rasio Guru : Siswa Keseluruhan:</strong> 1 : ${stats.rasioGuruSiswa} (Kategori Ideal)</p>
                <p class="text-slate-600 bg-white p-2 rounded border border-emerald-100">
                  <strong>Insight Strategis:</strong> Pertahankan rasio ideal GTY/CGTY dan lakukan evaluasi beban mengajar guru tetap sebelum mengajukan rekrutmen pegawai baru.
                </p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // MODUL VALIDASI PUSAT
    function renderValidasiModule(list) {
      if (list.length === 0) {
        return `<div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-500 text-xs">Belum ada data sekolah terdaftar di tahun ajaran ini.</div>`;
      }

      return `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
          <div class="border-b pb-3">
            <h3 class="font-bold text-slate-800 text-base">Persetujuan & Validasi Berkas Dokumen Wajib</h3>
            <p class="text-xs text-slate-500">Lakukan verifikasi dan validasi satu per satu pada ke-9 berkas dokumen laporan wajib yang diunggah oleh tiap sekolah.</p>
          </div>

          <div class="space-y-6">
            ${list.map(s => {
              const docs = s.dokumenLaporan || {};

              return `
                <div class="p-4 border rounded-xl space-y-4 bg-slate-50/50 shadow-sm">
                  <div class="flex flex-wrap items-center justify-between gap-3 border-b pb-3">
                    <div>
                      <h4 class="font-bold text-brand-blue text-sm">${s.nama}</h4>
                      <p class="text-xs text-slate-500">NPSN: ${s.npsn} \vert{} Status Pengisian:${renderStatusBadge(s.statusValidation)}</p>
                    </div>
                    <div>
                      <button onclick="showDetailModal('${s.npsn}')" class="bg-blue-100 hover:bg-blue-200 text-brand-blue border border-blue-300 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition flex items-center gap-1">
                        <i data-lucide="eye" class="w-3.5 h-3.5"></i> Periksa Isian Lengkap Sekolah
                      </button>
                    </div>
                  </div>

                  <div>
                    <h5 class="font-bold text-slate-700 text-xs mb-3">Daftar Validasi 9 Dokumen Wajib:</h5>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      ${docsConfig.map(d => {
                        const docObj = docs[d.key] || { status: "Belum Mengisi", notes: "", fileName: "" };
                        return `
                          <div class="p-3.5 rounded-xl border bg-white shadow-sm flex flex-col justify-between gap-3">
                            <div class="space-y-2">
                              <div class="flex items-start justify-between gap-2 border-b pb-2">
                                <span class="font-bold text-slate-800 text-xs leading-snug break-words">${d.label}</span>
                                <div class="shrink-0">${renderStatusBadge(docObj.status)}</div>
                              </div>

                              <div class="text-[11px] text-slate-500">
                                Berkas: <strong class="text-slate-700">${docObj.fileName || 'Belum ada file'}</strong>
                              </div>

                              <div>
                                <label class="block text-[10px] font-semibold text-slate-500 mb-1">Catatan / Revisi Pusat:</label>
                                <input type="text" id="note_${s.npsn}_${d.key}" value="${docObj.notes || ''}" placeholder="Tulis catatan revisi..." class="w-full p-2 border border-slate-300 rounded text-xs focus:ring-1 focus:ring-brand-blue outline-none">
                              </div>
                            </div>

                            <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                              <button onclick="updateSingleDocStatus('${s.npsn}', '${d.key}', 'Valid')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold py-1.5 px-2 rounded-lg transition text-center shadow-sm">
                                Setujui (Valid)
                              </button>
                              <button onclick="updateSingleDocStatus('${s.npsn}', '${d.key}', 'Perlu Perbaikan')" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-bold py-1.5 px-2 rounded-lg transition text-center shadow-sm">
                                Minta Perbaikan
                              </button>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function updateSingleDocStatus(npsn, docKey, status) {
      const taList = Object.keys(db).sort().reverse();
      const ta = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";
      const school = db[ta].find(s => s.npsn === npsn);
      const noteInput = document.getElementById(`note_${npsn}_${docKey}`);
      const notes = noteInput ? noteInput.value : "";

      if (school) {
        if (!school.dokumenLaporan) school.dokumenLaporan = {};
        if (!school.dokumenLaporan[docKey]) school.dokumenLaporan[docKey] = {};

        school.dokumenLaporan[docKey].status = status;
        school.dokumenLaporan[docKey].notes = notes;

        saveDB();
        renderPage('validasi');
      }
    }

    function showDetailModal(npsn) {
      const taList = Object.keys(db).sort().reverse();
      const ta = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";
      const s = db[ta].find(item => item.npsn === npsn);

      if (s) {
        document.getElementById('modalTitle').innerText = `Rincian Isian Data Lengkap: ${s.nama}`;
        const totalS = (s.siswa.k7L + s.siswa.k7P) + (s.siswa.k8L + s.siswa.k8P) + (s.siswa.k9L + s.siswa.k9P);

        document.getElementById('modalBody').innerHTML = `
          <div class="space-y-3">
            <div class="bg-slate-50 p-3 rounded border">
              <span class="font-bold text-brand-blue block mb-1">A. Identitas & Kepala Sekolah</span>
              <div>• Kepala Sekolah: <strong>${s.kepalaSekolah || '-'}</strong></div>
              <div>• Akreditasi: <strong>${getAkreditasiText(s.akreditasi)} ${s.tahunAkreditasi ? `(${s.tahunAkreditasi})` : ''}</strong></div>
              <div>• SK Pendirian: <strong>${s.legalitas?.skPendirian || '-'}</strong> (${s.legalitas?.tglSK || '-'})</div>
              <div>• SK Izin Operasional: <strong>${s.legalitas?.skIzin || '-'}</strong> (${s.legalitas?.tglSKIzin || '-'})</div>
            </div>

            <div class="bg-slate-50 p-3 rounded border">
              <span class="font-bold text-brand-blue block mb-1">B. Siswa & Rombel</span>
              <div>• Total Siswa: <strong>${totalS} Siswa</strong></div>
              <div>• Rincian Rombel: VII (${s.siswa.r7}), VIII (${s.siswa.r8}), IX (${s.siswa.r9})</div>
            </div>

            <div class="bg-slate-50 p-3 rounded border">
              <span class="font-bold text-brand-blue block mb-1">C. SDM Pendidik & Tendik</span>
              <div>• Guru Tetap Yayasan (GTY): <strong>${s.pendidik.gty || 0}</strong></div>
              <div>• Calon GTY: <strong>${s.pendidik.cgty || 0}</strong></div>
              <div>• DPK PNS: <strong>${s.pendidik.dpkPns || 0}</strong></div>
              <div>• KTY (Tendik): <strong>${s.tendik.kty || 0}</strong> | CKTY: <strong>${s.tendik.ckty || 0}</strong></div>
            </div>

            <div class="bg-slate-50 p-3 rounded border">
              <span class="font-bold text-brand-blue block mb-1">D. Keuangan (DOP & DSP)</span>
              <div>• DOP Umum: VII (${formatRupiah(s.keuangan?.dopUmum7)}), VIII (${formatRupiah(s.keuangan?.dopUmum8)}), IX (${formatRupiah(s.keuangan?.dopUmum9)})</div>
              <div>• DOP TNI AU: VII (${formatRupiah(s.keuangan?.dopTniau7)}), VIII (${formatRupiah(s.keuangan?.dopTniau8)}), IX (${formatRupiah(s.keuangan?.dopTniau9)})</div>
              <div>• DSP: Gel I (${formatRupiah(s.keuangan?.dspGel1)}), Gel II (${formatRupiah(s.keuangan?.dspGel2)}), Gel III (${formatRupiah(s.keuangan?.dspGel3)})</div>
            </div>
          </div>
        `;

        document.getElementById('detailModal').classList.remove('hidden');
        lucide.createIcons();
      }
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function exportToExcel() {
      alert("Memulai pengunduhan rekap data SIDSA dalam format Excel/CSV...");
    }
  </script>
</body>
</html>
