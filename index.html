<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Informasi Data SMP Angkasa (SIDSA)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0052cc',
              blueDark: '#003d99',
              blueLight: '#e6f0ff',
              orange: '#ffab00',
              orangeDark: '#e69900',
              grayBg: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-grayBg font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- TOP HEADER -->
  <header class="bg-brand-blue text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-2 rounded-lg text-brand-blue font-bold text-xl shadow">
          <i data-lucide="graduation-cap" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight tracking-wide">SIDSA</h1>
          <p class="text-xs text-blue-200">Sistem Informasi Data SMP Angkasa Yayasan</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- RESET STORAGE BUTTON -->
        <button onclick="resetDataDemo()" class="text-xs font-semibold bg-blue-800 hover:bg-blue-700 text-blue-200 hover:text-white px-2.5 py-1.5 rounded-lg border border-blue-400/30 transition flex items-center gap-1">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Data
        </button>

        <!-- ROLE SELECTOR -->
        <div class="flex items-center space-x-2 bg-blue-900/50 p-1.5 rounded-lg border border-blue-400/30">
          <span class="text-xs font-semibold text-blue-200 flex items-center gap-1">
            <i data-lucide="user-check" class="w-4 h-4"></i> Akses:
          </span>
          <select id="roleSelect" onchange="switchRole(this.value)" class="bg-white text-slate-800 text-xs font-bold py-1 px-2.5 rounded shadow focus:outline-none focus:ring-2 focus:ring-brand-orange">
            <optgroup label="Akses Pusat / Pengawas">
              <option value="ADMIN">Admin Yayasan (Semua Data)</option>
              <option value="VIEWER">Viewer / Pimpinan (Read-Only)</option>
            </optgroup>
            <optgroup label="Simulasi Akses Sekolah">
              <option value="SEKOLAH_20100001">Sekolah: SMP Angkasa 1 Jakarta</option>
              <option value="SEKOLAH_20100002">Sekolah: SMP Angkasa 2 Bandung</option>
              <option value="SEKOLAH_20100003">Sekolah: SMP Angkasa 3 Surakarta</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
  </header>

  <div class="flex flex-1 max-w-7xl w-full mx-auto px-4 py-6 gap-6">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 hidden md:block">
      <div class="mb-4 px-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Menu Utama</div>
      <nav class="space-y-1" id="sidebarMenu"></nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 space-y-6 overflow-hidden">

      <!-- GLOBAL FILTER BAR -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-3" id="filterControlsContainer">
          <!-- Dynamic Filter Controls -->
        </div>

        <div class="flex items-center gap-2">
          <button onclick="exportToExcel()" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
          </button>
          <button onclick="window.print()" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition">
            <i data-lucide="printer" class="w-4 h-4"></i> Cetak / PDF
          </button>
        </div>
      </div>

      <!-- PAGE CONTENT CONTAINER -->
      <div id="pageContent"></div>

    </main>
  </div>

  <!-- MODAL DETAIL PEMERIKSAAN ITEM -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Detail Rincian Isian Data</h3>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="modalBody" class="text-xs space-y-3 max-h-96 overflow-y-auto">
        <!-- Injected Dynamically -->
      </div>
      <div class="text-right border-t pt-3">
        <button onclick="closeDetailModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-lg text-xs">Tutup Window</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // INITIAL DATABASE
    const initialData = {
      "2026/2027": [
        {
          npsn: "20100001",
          nama: "SMP Angkasa 1 Jakarta",
          cabang: "Jakarta",
          akreditasi: "A",
          tahunAkreditasi: "2023",
          kepalaSekolah: "Drs. Budi Santoso, M.Pd",
          statusValidation: "Belum Mengisi",
          lastUpdate: "2026-09-15",
          legalitas: { skPendirian: "SK-001/YAS/2010", tglSK: "2010-05-12" },
          siswa: { k7L: 60, k7P: 60, r7: 4, k8L: 55, k8P: 55, r8: 4, k9L: 50, k9P: 50, r9: 4 },
          pendidik: { L: 12, P: 16, gty: 20, cgty: 5, dpkPns: 3 },
          tendik: { L: 3, P: 5, kty: 6, ckty: 2 },
          keuangan: { dop7: 300000, dop8: 300000, dop9: 300000, dsp7: 3500000, dsp8: 0, dsp9: 0 },
          dokumenLaporan: {
            rkas: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            rpss: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            raporPendidikan: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            mpls: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            kaldik: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            sarpras: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            medsos: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" }
          }
        },
        {
          npsn: "20100002",
          nama: "SMP Angkasa 2 Bandung",
          cabang: "Bandung",
          akreditasi: "A",
          tahunAkreditasi: "2022",
          kepalaSekolah: "Hj. Siti Rahmah, S.Pd",
          statusValidation: "Menunggu Validasi",
          lastUpdate: "2026-09-28",
          legalitas: { skPendirian: "SK-002/YAS/2012", tglSK: "2012-08-10" },
          siswa: { k7L: 45, k7P: 45, r7: 3, k8L: 40, k8P: 40, r8: 3, k9L: 42, k9P: 38, r9: 3 },
          pendidik: { L: 8, P: 14, gty: 15, cgty: 4, dpkPns: 3 },
          tendik: { L: 2, P: 4, kty: 4, ckty: 2 },
          keuangan: { dop7: 250000, dop8: 250000, dop9: 250000, dsp7: 3000000, dsp8: 0, dsp9: 0 },
          dokumenLaporan: {
            rkas: { status: "Menunggu Validasi", notes: "Menunggu verifikasi yayasan" },
            rpss: { status: "Perlu Perbaikan", notes: "Revisi Rencana Anggaran Sarpras" },
            raporPendidikan: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            mpls: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            kaldik: { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" },
            sarpras: { status: "Menunggu Validasi", notes: "Pending pengecekan" },
            medsos: { status: "Perlu Perbaikan", notes: "Lampirkan statistik engagement" }
          }
        },
        {
          npsn: "20100003",
          nama: "SMP Angkasa 3 Surakarta",
          cabang: "Surakarta",
          akreditasi: "B",
          tahunAkreditasi: "2024",
          kepalaSekolah: "Ahmad Dahlan, M.T",
          statusValidation: "Perlu Perbaikan",
          lastUpdate: "2026-08-10",
          legalitas: { skPendirian: "SK-008/YAS/2015", tglSK: "2015-01-20" },
          siswa: { k7L: 30, k7P: 30, r7: 2, k8L: 28, k8P: 28, r8: 2, k9L: 25, k9P: 25, r9: 2 },
          pendidik: { L: 6, P: 8, gty: 10, cgty: 3, dpkPns: 1 },
          tendik: { L: 2, P: 2, kty: 3, ckty: 1 },
          keuangan: { dop7: 200000, dop8: 200000, dop9: 200000, dsp7: 2500000, dsp8: 0, dsp9: 0 },
          dokumenLaporan: {
            rkas: { status: "Perlu Perbaikan", notes: "Perbaiki pos anggaran ekskul" },
            rpss: { status: "Belum Mengisi", notes: "Belum diunggah" },
            raporPendidikan: { status: "Belum Mengisi", notes: "Belum diunggah" },
            mpls: { status: "Belum Mengisi", notes: "Belum diunggah" },
            kaldik: { status: "Belum Mengisi", notes: "Belum diunggah" },
            sarpras: { status: "Perlu Perbaikan", notes: "Sertakan foto perpustakaan" },
            medsos: { status: "Belum Mengisi", notes: "Belum diunggah" }
          }
        }
      ],
      "2025/2026": [],
      "2024/2025": []
    };

    let currentRoleSelection = localStorage.getItem('sidsa_role_v6') || 'ADMIN';
    let activeTab = 'dashboard';
    let db = JSON.parse(localStorage.getItem('sidsa_db_v6')) || initialData;

    function saveDB() {
      localStorage.setItem('sidsa_db_v6', JSON.stringify(db));
    }

    function resetDataDemo() {
      localStorage.removeItem('sidsa_db_v6');
      db = initialData;
      saveDB();
      alert("Data berhasil di-reset ke kondisi awal.");
      location.reload();
    }

    function parseRoleInfo() {
      if (currentRoleSelection.startsWith('SEKOLAH_')) {
        return { role: 'SEKOLAH', npsn: currentRoleSelection.split('_')[1] };
      }
      return { role: currentRoleSelection, npsn: null };
    }

    window.onload = function() {
      document.getElementById('roleSelect').value = currentRoleSelection;
      renderSidebar();
      renderFilterControls();
      renderPage('dashboard');
      lucide.createIcons();
    };

    function switchRole(val) {
      currentRoleSelection = val;
      localStorage.setItem('sidsa_role_v6', val);
      renderSidebar();
      renderFilterControls();
      applyFilters();
    }

    const menuItems = [
      { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'identitas', label: 'Identitas & Legalitas', icon: 'school', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'peserta_didik', label: 'Peserta Didik & Rombel', icon: 'users', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'pendidik_tendik', label: 'Pendidik & Tendik', icon: 'user-check', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'keuangan', label: 'Data Keuangan', icon: 'wallet', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'dokumen_tambahan', label: 'Dokumen & Laporan', icon: 'file-text', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'analisis', label: 'Analisis & Insight', icon: 'bar-chart-3', roles: ['ADMIN', 'VIEWER'] },
      { id: 'validasi', label: 'Validasi Data', icon: 'check-square', roles: ['ADMIN'] },
      { id: 'laporan', label: 'Rekap Laporan', icon: 'download', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] }
    ];

    function renderSidebar() {
      const container = document.getElementById('sidebarMenu');
      container.innerHTML = '';
      const { role } = parseRoleInfo();

      menuItems.forEach(item => {
        if (item.roles.includes(role)) {
          const isActive = activeTab === item.id;
          const btn = document.createElement('button');
          btn.onclick = () => { activeTab = item.id; renderSidebar(); renderPage(item.id); };
          btn.className = `w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-xs font-bold transition ${
            isActive ? 'bg-brand-blue text-white shadow' : 'text-slate-600 hover:bg-slate-100'
          }`;
          btn.innerHTML = `<i data-lucide="${item.icon}" class="w-4 h-4"></i> <span>${item.label}</span>`;
          container.appendChild(btn);
        }
      });
      lucide.createIcons();
    }

    function renderFilterControls() {
      const container = document.getElementById('filterControlsContainer');
      const { role, npsn } = parseRoleInfo();

      if (role === 'SEKOLAH') {
        const ta = document.getElementById('filterTA')?.value || "2026/2027";
        const currentSchool = db[ta]?.find(s => s.npsn === npsn);
        const schoolName = currentSchool ? currentSchool.nama : "Sekolah";

        container.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Tahun Ajaran</label>
            <select id="filterTA" onchange="applyFilters()" class="text-xs font-semibold border border-slate-300 rounded-md p-2 bg-slate-50 focus:ring-2 focus:ring-brand-blue outline-none">
              <option value="2026/2027">2026/2027</option>
              <option value="2025/2026">2025/2026</option>
              <option value="2024/2025">2024/2025</option>
            </select>
          </div>
          <div class="self-end pb-2">
            <span class="text-xs font-bold bg-blue-100 text-brand-blue px-3 py-1.5 rounded-md border border-blue-200">
              Akses Terkunci: ${schoolName}
            </span>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Tahun Ajaran</label>
            <select id="filterTA" onchange="applyFilters()" class="text-xs font-semibold border border-slate-300 rounded-md p-2 bg-slate-50 focus:ring-2 focus:ring-brand-blue outline-none">
              <option value="2026/2027">2026/2027</option>
              <option value="2025/2026">2025/2026</option>
              <option value="2024/2025">2024/2025</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Cabang</label>
            <select id="filterCabang" onchange="applyFilters()" class="text-xs font-semibold border border-slate-300 rounded-md p-2 bg-slate-50 focus:ring-2 focus:ring-brand-blue outline-none">
              <option value="ALL">Semua Cabang</option>
              <option value="Jakarta">Cabang Jakarta</option>
              <option value="Bandung">Cabang Bandung</option>
              <option value="Surakarta">Cabang Surakarta</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Sekolah</label>
            <select id="filterSekolah" onchange="applyFilters()" class="text-xs font-semibold border border-slate-300 rounded-md p-2 bg-slate-50 focus:ring-2 focus:ring-brand-blue outline-none">
              <option value="ALL">Semua SMP Angkasa</option>
              <option value="20100001">SMP Angkasa 1 Jakarta</option>
              <option value="20100002">SMP Angkasa 2 Bandung</option>
              <option value="20100003">SMP Angkasa 3 Surakarta</option>
            </select>
          </div>
        `;
      }
    }

    function applyFilters() {
      renderPage(activeTab);
    }

    function getFilteredData() {
      const ta = document.getElementById('filterTA')?.value || "2026/2027";
      let list = db[ta] || [];
      const { role, npsn } = parseRoleInfo();

      if (role === 'SEKOLAH') {
        list = list.filter(s => s.npsn === npsn);
      } else {
        const cabangElem = document.getElementById('filterCabang');
        const sekolahElem = document.getElementById('filterSekolah');
        const cabang = cabangElem ? cabangElem.value : 'ALL';
        const sekolah = sekolahElem ? sekolahElem.value : 'ALL';

        if (cabang !== 'ALL') list = list.filter(s => s.cabang === cabang);
        if (sekolah !== 'ALL') list = list.filter(s => s.npsn === sekolah);
      }
      return list;
    }

    function calcStats(list) {
      let totalSekolah = list.length;
      let totalSiswa = 0;
      let totalRombel = 0;
      let totalPendidik = 0;
      let totalTendik = 0;
      let totalDOPBulan = 0;

      list.forEach(s => {
        const sSiswa = (s.siswa.k7L + s.siswa.k7P) + (s.siswa.k8L + s.siswa.k8P) + (s.siswa.k9L + s.siswa.k9P);
        const sRombel = s.siswa.r7 + s.siswa.r8 + s.siswa.r9;
        const sPendidik = s.pendidik.L + s.pendidik.P;
        const sTendik = s.tendik.L + s.tendik.P;

        const dopBln = ((s.siswa.k7L + s.siswa.k7P) * s.keuangan.dop7) +
                       ((s.siswa.k8L + s.siswa.k8P) * s.keuangan.dop8) +
                       ((s.siswa.k9L + s.siswa.k9P) * s.keuangan.dop9);

        totalSiswa += sSiswa;
        totalRombel += sRombel;
        totalPendidik += sPendidik;
        totalTendik += sTendik;
        totalDOPBulan += dopBln;
      });

      return {
        totalSekolah, totalSiswa, totalRombel, totalPendidik, totalTendik, totalDOPBulan,
        rasioGuruSiswa: totalPendidik ? (totalSiswa / totalPendidik).toFixed(1) : 0
      };
    }

    function formatRupiah(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
    }

    function getAkreditasiText(akred) {
      if (akred === 'A') return 'A (Predikat Unggul)';
      if (akred === 'B') return 'B (Predikat Sangat Baik)';
      if (akred === 'C') return 'C (Predikat Baik)';
      if (akred === 'D') return 'D (Tidak Terakreditasi)';
      return akred || '-';
    }

    function renderStatusBadge(status) {
      if (status === 'Sudah Valid' || status === 'Valid') {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300"><i data-lucide="check-circle" class="w-3 h-3 text-emerald-600"></i> Valid</span>`;
      } else if (status === 'Perlu Perbaikan' || status === 'Belum Mengisi') {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-300"><i data-lucide="alert-triangle" class="w-3 h-3 text-rose-600"></i> ${status}</span>`;
      } else {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300"><i data-lucide="clock" class="w-3 h-3 text-amber-600"></i> ${status}</span>`;
      }
    }

    function renderPage(page) {
      const container = document.getElementById('pageContent');
      const list = getFilteredData();
      const stats = calcStats(list);

      if (page === 'dashboard') {
        container.innerHTML = `
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-blue-100 text-brand-blue rounded-lg"><i data-lucide="school" class="w-6 h-6"></i></div>
              <div><p class="text-xs text-slate-500 font-semibold">Total Sekolah</p><h3 class="text-xl font-black text-slate-800">${stats.totalSekolah}</h3></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-amber-100 text-amber-600 rounded-lg"><i data-lucide="users" class="w-6 h-6"></i></div>
              <div><p class="text-xs text-slate-500 font-semibold">Total Peserta Didik</p><h3 class="text-xl font-black text-slate-800">${stats.totalSiswa}</h3></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i data-lucide="user-check" class="w-6 h-6"></i></div>
              <div><p class="text-xs text-slate-500 font-semibold">Rasio Guru : Siswa</p><h3 class="text-xl font-black text-slate-800">1 : ${stats.rasioGuruSiswa}</h3></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">
              <div class="p-3 bg-indigo-100 text-indigo-600 rounded-lg"><i data-lucide="wallet" class="w-6 h-6"></i></div>
              <div><p class="text-xs text-slate-500 font-semibold">Total DOP Bulanan</p><h3 class="text-lg font-black text-slate-800">${formatRupiah(stats.totalDOPBulan)}</h3></div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
              <h4 class="font-bold text-slate-800 text-sm mb-4 flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-4 h-4 text-brand-blue"></i> Distribusi Siswa per Sekolah</h4>
              <canvas id="chartSiswa" class="max-h-64"></canvas>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
              <h4 class="font-bold text-slate-800 text-sm mb-4 flex items-center gap-2"><i data-lucide="pie-chart" class="w-4 h-4 text-brand-orange"></i> Komposisi SDM (Guru vs Tendik)</h4>
              <canvas id="chartSDM" class="max-h-64"></canvas>
            </div>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">

            <h3 class="font-bold text-slate-800 text-base">Rincian DOP & DSP Keuangan</h3>
            ${isSekolah ? '<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-md">Modul Input Sekolah</span>' : ''}
          </div>

          ${list.map(s => {
            const tot7 = s.siswa.k7L + s.siswa.k7P;
            const tot8 = s.siswa.k8L + s.siswa.k8P;
            const tot9 = s.siswa.k9L + s.siswa.k9P;

            const dopBln7 = tot7 * s.keuangan.dop7;
            const dopBln8 = tot8 * s.keuangan.dop8;
            const dopBln9 = tot9 * s.keuangan.dop9;
            const totalDOPBulan = dopBln7 + dopBln8 + dopBln9;
            const totalDOPTahun = totalDOPBulan * 12;

            return `
              <div class="border rounded-lg p-4 space-y-4 bg-slate-50/30">
                <h4 class="font-bold text-brand-blue text-sm">${s.nama}</h4>

                ${isSekolah ? `
                  <form onsubmit="saveKeuanganData(event, '${s.npsn}')" class="space-y-4 text-xs">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div class="bg-white p-3 rounded border">
                        <label class="font-bold text-slate-700 block mb-1">DOP Kelas VII (/Siswa/Bln)</label>
                        <input type="number" id="dop7_${s.npsn}" value="${s.keuangan.dop7}" class="w-full p-2 border rounded">
                      </div>
                      <div class="bg-white p-3 rounded border">
                        <label class="font-bold text-slate-700 block mb-1">DOP Kelas VIII (/Siswa/Bln)</label>
                        <input type="number" id="dop8_${s.npsn}" value="${s.keuangan.dop8}" class="w-full p-2 border rounded">
                      </div>
                      <div class="bg-white p-3 rounded border">
                        <label class="font-bold text-slate-700 block mb-1">DOP Kelas IX (/Siswa/Bln)</label>
                        <input type="number" id="dop9_${s.npsn}" value="${s.keuangan.dop9}" class="w-full p-2 border rounded">
                      </div>
                    </div>

                    <div class="bg-white p-3 rounded border">
                      <label class="font-bold text-slate-700 block mb-1">DSP Kelas VII (Nominal Sekali Bayar)</label>
                      <input type="number" id="dsp7_${s.npsn}" value="${s.keuangan.dsp7}" class="w-full p-2 border rounded">
                    </div>

                    <div class="text-right">
                      <button type="submit" class="bg-brand-blue hover:bg-brand-blueDark text-white font-bold px-4 py-2 rounded-lg shadow text-xs">Simpan Data Keuangan</button>
                    </div>
                  </form>
                ` : ''}

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                  <div class="bg-white p-3.5 rounded border space-y-1">
                    <span class="font-bold text-slate-700 block border-b pb-1">DOP Bulanan (per Tingkat)</span>
                    <div>Kelas VII: <strong>${formatRupiah(dopBln7)}</strong></div>
                    <div>Kelas VIII: <strong>${formatRupiah(dopBln8)}</strong></div>
                    <div>Kelas IX: <strong>${formatRupiah(dopBln9)}</strong></div>
                    <div class="pt-1 border-t font-bold text-brand-blue">Total Bulanan: ${formatRupiah(totalDOPBulan)}</div>
                  </div>

                  <div class="bg-white p-3.5 rounded border space-y-1">
                    <span class="font-bold text-slate-700 block border-b pb-1">DOP Tahunan (per Tingkat)</span>
                    <div>Kelas VII: <strong>${formatRupiah(dopBln7 * 12)}</strong></div>
                    <div>Kelas VIII: <strong>${formatRupiah(dopBln8 * 12)}</strong></div>
                    <div>Kelas IX: <strong>${formatRupiah(dopBln9 * 12)}</strong></div>
                    <div class="pt-1 border-t font-bold text-emerald-600">Total Tahunan: ${formatRupiah(totalDOPTahun)}</div>
                  </div>

                  <div class="bg-white p-3.5 rounded border space-y-1">
                    <span class="font-bold text-slate-700 block border-b pb-1">DSP (Sumbangan Pendidikan)</span>
                    <div>DSP Kelas VII: <strong>${formatRupiah(s.keuangan.dsp7)} / siswa</strong></div>
                    <div>Total DSP Diterima: <strong>${formatRupiah(tot7 * s.keuangan.dsp7)}</strong></div>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function saveKeuanganData(e, npsn) {
      e.preventDefault();
      const ta = document.getElementById('filterTA')?.value || "2026/2027";
      const school = db[ta].find(s => s.npsn === npsn);
      if (school) {
        school.keuangan.dop7 = parseInt(document.getElementById(`dop7_${npsn}`).value) || 0;
        school.keuangan.dop8 = parseInt(document.getElementById(`dop8_${npsn}`).value) || 0;
        school.keuangan.dop9 = parseInt(document.getElementById(`dop9_${npsn}`).value) || 0;
        school.keuangan.dsp7 = parseInt(document.getElementById(`dsp7_${npsn}`).value) || 0;
        school.statusValidation = "Menunggu Validasi";
        saveDB();
        alert("Data Keuangan Berhasil Diperbarui!");
        renderPage('keuangan');
      }
    }

    // MODUL DOKUMEN & LAPORAN TAMBAHAN
    function renderDokumenTambahanModule(list) {
      const { role } = parseRoleInfo();
      const isEditable = role === 'SEKOLAH';
      const docsConfig = [
        { key: 'rkas', label: 'RKAS' },
        { key: 'rpss', label: 'RPSS' },
        { key: 'raporPendidikan', label: 'Rapor Pendidikan Sekolah' },
        { key: 'mpls', label: 'Hasil Laporan MPLS' },
        { key: 'kaldik', label: 'Kalender Pendidikan Sekolah' },
        { key: 'sarpras', label: 'Data Sarana dan Prasarana' },
        { key: 'medsos', label: 'Laporan Perkembangan Media Sosial' }
      ];

      return `
        <div class="space-y-6">
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <h3 class="font-bold text-slate-800 text-base">Kelengkapan Dokumen Wajib & Operasional Sekolah</h3>
              <p class="text-xs text-slate-500">Status Validasi Yayasan: Warna Hijau (Sudah Valid), Warna Kuning (Menunggu Validasi), Warna Merah (Belum Mengisi / Perlu Perbaikan).</p>
            </div>
          </div>

          ${list.map(s => {
            const docs = s.dokumenLaporan || {};
            return `
              <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-6">
                <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                  <div>
                    <h4 class="font-bold text-brand-blue text-sm">${s.nama}</h4>
                    <p class="text-xs text-slate-500">NPSN: ${s.npsn} \vert{} Cabang:${s.cabang}</p>
                  </div>
                </div>

                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                  ${docsConfig.map(doc => {
                    const docData = docs[doc.key] || { status: "Belum Mengisi", notes: "Belum ada berkas diunggah" };
                    let bgBorderClass = "border-rose-200 bg-rose-50/30";
                    if (docData.status === 'Valid') bgBorderClass = "border-emerald-200 bg-emerald-50/30";
                    if (docData.status === 'Menunggu Validasi') bgBorderClass = "border-amber-200 bg-amber-50/30";

                    return `
                      <div class="p-3 rounded-lg border flex items-start justify-between gap-3 ${bgBorderClass}">
                        <div class="space-y-1">
                          <span class="text-xs font-bold text-slate-800 block">${doc.label}</span>
                          <span class="text-[11px] text-slate-500 block">Catatan Validasi: ${docData.notes || '-'}</span>
                          ${isEditable ? `
                            <div class="mt-2 flex items-center gap-2">
                              <input type="file" onchange="uploadDocFile('${s.npsn}', '${doc.key}')" class="text-[10px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-[10px] file:font-semibold file:bg-slate-200 file:text-slate-700 hover:file:bg-slate-300">
                            </div>
                          ` : ''}
                        </div>
                        <div class="text-right shrink-0">
                          ${renderStatusBadge(docData.status)}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function uploadDocFile(npsn, docKey) {
      const ta = document.getElementById('filterTA')?.value || "2026/2027";
      const school = db[ta].find(s => s.npsn === npsn);
      if (school) {
        if (!school.dokumenLaporan) school.dokumenLaporan = {};
        school.dokumenLaporan[docKey] = {
          status: "Menunggu Validasi",
          notes: "Berkas baru diunggah oleh sekolah"
        };
        saveDB();
        alert("Berkas berhasil diunggah! Status berubah menjadi Menunggu Validasi (Kuning).");
        renderPage('dokumen_tambahan');
      }
    }

    // MODUL VALIDASI DATA (VERSI TERPERINCI PER DOKUMEN & MODUL)
    function renderValidasiModule(list) {
      const docsConfig = [
        { key: 'rkas', label: 'RKAS' },
        { key: 'rpss', label: 'RPSS' },
        { key: 'raporPendidikan', label: 'Rapor Pendidikan' },
        { key: 'mpls', label: 'Laporan MPLS' },
        { key: 'kaldik', label: 'Kalender Pend.' },
        { key: 'sarpras', label: 'Data Sarpras' },
        { key: 'medsos', label: 'Media Sosial' }
      ];

      return `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
          <div class="border-b pb-3">
            <h3 class="font-bold text-slate-800 text-base">Persetujuan & Validasi Data Sekolah oleh Yayasan</h3>
            <p class="text-xs text-slate-500">Pilih item atau modul spesifik di bawah ini yang membutuhkan persetujuan/validasi dari Admin Yayasan.</p>
          </div>

          <div class="space-y-6">
            ${list.map(s => {
              const totalSiswa = (s.siswa.k7L + s.siswa.k7P) + (s.siswa.k8L + s.siswa.k8P) + (s.siswa.k9L + s.siswa.k9P);
              const totalGuru = s.pendidik.L + s.pendidik.P;
              const docs = s.dokumenLaporan || {};

              return `
                <div class="p-4 border rounded-xl space-y-4 bg-slate-50/50 shadow-sm">
                  
                  <!-- HEADER SEKOLAH -->
                  <div class="flex flex-wrap items-center justify-between gap-3 border-b pb-3">
                    <div>
                      <h4 class="font-bold text-brand-blue text-sm">${s.nama}</h4>
                      <p class="text-xs text-slate-500">NPSN: ${s.npsn} | Update Terakhir: ${s.lastUpdate} \vert{} Status Keseluruhan:${renderStatusBadge(s.statusValidation)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="showDetailModal('${s.npsn}')" class="bg-blue-100 hover:bg-blue-200 text-brand-blue border border-blue-300 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition flex items-center gap-1">
                        <i data-lucide="eye" class="w-3.5 h-3.5"></i> Periksa Semua Isian Data
                      </button>
                      <button onclick="updateValidationStatus('${s.npsn}', 'Sudah Valid')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition">
                        Setujui Semua (Valid)
                      </button>
                      <button onclick="updateValidationStatus('${s.npsn}', 'Perlu Perbaikan')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition">
                        Minta Perbaikan
                      </button>
                    </div>
                  </div>

                  <!-- ITEM VALIDASI 1: DOKUMEN LAPORAN WAJIB -->
                  <div class="bg-white p-3 rounded-lg border space-y-2">
                    <span class="font-bold text-slate-700 text-xs block">1. Validasi Berkas / Dokumen Laporan Wajib:</span>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                      ${docsConfig.map(d => {
                        const docObj = docs[d.key] || { status: "Belum Mengisi", notes: "-" };
                        return `
                          <div class="p-2.5 rounded border bg-slate-50 flex items-center justify-between gap-2">
                            <div class="truncate">
                              <span class="font-bold block truncate">${d.label}</span>
                              <span class="text-[10px] text-slate-500 block truncate">${docObj.notes || '-'}</span>
                            </div>
                            <div class="shrink-0 text-right">
                              ${renderStatusBadge(docObj.status)}

                      }).join('')}
                    </div>

                  <!-- ITEM VALIDASI 2: ISIAN ANGKA MODUL UTAMA -->
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                    
                    <div class="bg-white p-3 rounded-lg border space-y-1">
                      <span class="text-slate-500 font-bold block border-b pb-1">2. Data Siswa & Rombel</span>
                      <p>Total Siswa: <strong>${totalSiswa} Siswa</strong></p>
                      <p>Rombel: <strong>${s.siswa.r7 + s.siswa.r8 + s.siswa.r9} Rombel</strong></p>
                      <div class="pt-2 flex gap-1">
                        <button onclick="alert('Isian data siswa disetujui.')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-[10px] font-bold px-2 py-1 rounded">ACC Siswa</button>

                      <span class="text-slate-500 font-bold block border-b pb-1">3. Data SDM & Kepegawaian</span>
                      <p>Guru: <strong>${totalGuru} Orang</strong> (GTY: ${s.pendidik.gty \vert{}\vert{} 0}, DPK:${s.pendidik.dpkPns || 0})</p>
                      <p>Tendik: <strong>${s.tendik.L + s.tendik.P} Orang</strong></p>
                      <div class="pt-2 flex gap-1">
                        <button onclick="alert('Isian SDM disetujui.')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-[10px] font-bold px-2 py-1 rounded">ACC SDM</button>
                      </div>
                    </div>

                    <div class="bg-white p-3 rounded-lg border space-y-1">
                      <span class="text-slate-500 font-bold block border-b pb-1">4. Tarif Keuangan DOP & DSP</span>
                      <p>DOP VII/VIII/IX: <strong>${formatRupiah(s.keuangan.dop7)}</strong></p>
                      <p>DSP Kelas VII: <strong>${formatRupiah(s.keuangan.dsp7)}</strong></p>
                      <div class="pt-2 flex gap-1">
                        <button onclick="alert('Tarif keuangan disetujui.')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-[10px] font-bold px-2 py-1 rounded">ACC Keuangan</button>
                      </div>
                    </div>

                  </div>

                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

      if (s) {
        document.getElementById('modalTitle').innerText = `Rincian Isian Data Lengkap: ${s.nama}`;
        const totalS = (s.siswa.k7L + s.siswa.k7P) + (s.siswa.k8L + s.siswa.k8P) + (s.siswa.k9L + s.siswa.k9P);

        document.getElementById('modalBody').innerHTML = `
          <div class="space-y-3">
            <div class="bg-slate-50 p-3 rounded border">
              <span class="font-bold text-brand-blue block mb-1">A. Identitas & Kepala Sekolah</span>
              <div>• Kepala Sekolah: <strong>${s.kepalaSekolah}</strong></div>
              <div>• Akreditasi: <strong>${getAkreditasiText(s.akreditasi)}</strong></div>
              <div>• SK Pendirian: <strong>${s.legalitas?.skPendirian || '-'}</strong> (${s.legalitas?.tglSK || '-'})</div>
            </div>

            <div class="bg-slate-50 p-3 rounded border">
              <span class="font-bold text-brand-blue block mb-1">B. Siswa & Rombel</span>
              <div>• Total Siswa: <strong>${totalS} Siswa</strong></div>
              <div>• Rincian Rombel: VII (${s.siswa.r7}), VIII (${s.siswa.r8}), IX (${s.siswa.r9})</div>
            </div>

            <div class="bg-slate-50 p-3 rounded border">
              <span class="font-bold text-brand-blue block mb-1">C. SDM Pendidik & Tendik</span>
              <div>• Guru Tetap Yayasan (GTY): <strong>${s.pendidik.gty || 0}</strong></div>
              <div>• Calon GTY: <strong>${s.pendidik.cgty || 0}</strong></div>
              <div>• DPK PNS: <strong>${s.pendidik.dpkPns || 0}</strong></div>
              <div>• KTY (Tendik): <strong>${s.tendik.kty || 0}</strong> | CKTY: <strong>${s.tendik.ckty || 0}</strong></div>
            </div>

            <div class="bg-slate-50 p-3 rounded border">
              <span class="font-bold text-brand-blue block mb-1">D. Keuangan (DOP & DSP)</span>
              <div>• DOP Kelas 7/8/9: <strong>${formatRupiah(s.keuangan.dop7)} / bln</strong></div>
              <div>• DSP Kelas 7: <strong>${formatRupiah(s.keuangan.dsp7)}</strong></div>
            </div>
          </div>
        `;

        document.getElementById('detailModal').classList.remove('hidden');
        lucide.createIcons();
      }
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function updateValidationStatus(npsn, status) {
      const ta = document.getElementById('filterTA')?.value || "2026/2027";
      const school = db[ta].find(s => s.npsn === npsn);
      if (school) {
        school.statusValidation = status;
        saveDB();
        renderPage('validasi');
      }
    }

    function exportToExcel() {
      alert("Memulai pengunduhan rekap data SIDSA dalam format Excel/CSV...");
    }
  </script>
</body>
