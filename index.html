<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Data Sekolah Angkasa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Check Auth Session
        const currentUser = JSON.parse(localStorage.getItem('angkasa_user'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        angkasa: {
                            blue: '#0F4C81',
                            darkBlue: '#0A3459',
                            orange: '#F58220',
                            orangeHover: '#d96f16',
                            bg: '#F8FAFC'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0A3459; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1E588A; border-radius: 3px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- SIDEBAR -->
    <aside class="w-72 bg-angkasa-darkBlue text-white flex flex-col justify-between flex-shrink-0 shadow-xl z-20">
        <div class="flex flex-col h-full">
            <!-- Brand -->
            <div class="p-6 border-b border-slate-700/60 bg-angkasa-blue/30">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-angkasa-orange rounded-xl text-white shadow-lg shadow-angkasa-orange/30">
                        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-sm tracking-wide text-white leading-tight uppercase">Sistem Informasi</h1>
                        <p class="text-xs text-amber-400 font-semibold tracking-wider">DATA SEKOLAH ANGKASA</p>
                    </div>
                </div>
            </div>

            <!-- Dynamic Nav Menu based on Role -->
            <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto custom-scrollbar" id="nav-container">
            </nav>

            <!-- User Footer -->
            <div class="p-4 mx-4 mb-4 bg-slate-800/80 rounded-2xl border border-slate-700/50">
                <div class="flex items-center space-x-3 mb-3">
                    <div class="w-9 h-9 rounded-full bg-angkasa-blue flex items-center justify-center font-bold text-amber-400 border border-amber-400/30">
                        <span id="user-avatar">A</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p id="user-name" class="text-sm font-semibold text-white truncate">Administrator</p>
                        <span id="user-role" class="inline-block px-2 py-0.5 text-[10px] font-bold bg-amber-400/20 text-amber-300 rounded-md border border-amber-400/30">Yayasan Angkasa</span>
                    </div>
                </div>
                <button onclick="handleLogout()" class="w-full py-2 bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 font-semibold text-xs rounded-xl transition flex items-center justify-center space-x-2">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    <span>Keluar Sistem</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between z-10 shadow-sm">
            <div>
                <h2 id="page-title" class="text-xl font-bold text-slate-900">Dashboard</h2>
                <p id="page-subtitle" class="text-xs text-slate-500 mt-0.5">Sistem Informasi Data Sekolah Angkasa</p>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-6" id="content-container">
        </div>
    </main>

    <script>
        lucide.createIcons();
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw5CmgiR3d5poaHOpQqM5qijtKjqOxdMjTIA8ANadu5s5hMNznO4x9XKX3MsjzQKD5eSQ/exec';

        // Load Session
        document.getElementById('user-name').innerText = currentUser.name || 'User';
        document.getElementById('user-role').innerText = currentUser.role === 'YAYASAN' ? 'Pengurus Yayasan' : 'Operator Sekolah';
        document.getElementById('user-avatar').innerText = (currentUser.name || 'A').charAt(0).toUpperCase();

        const navContainer = document.getElementById('nav-container');
        const contentContainer = document.getElementById('content-container');

        if (currentUser.role === 'SEKOLAH') {
            document.getElementById('page-title').innerText = "Form Input Data Sekolah";
            document.getElementById('page-subtitle').innerText = `Input data periodik untuk: ${currentUser.school}`;

            navContainer.innerHTML = `
                <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm bg-angkasa-orange text-white shadow-md">
                    <i data-lucide="edit-3" class="w-5 h-5"></i>
                    <span>Input Data Sekolah</span>
                </a>
            `;

            contentContainer.innerHTML = `
                <div class="max-w-2xl bg-white p-8 rounded-3xl border border-slate-200/80 shadow-sm">
                    <h3 class="font-bold text-base text-slate-800 mb-1">Input / Update Data Periodic Sekolah</h3>
                    <p class="text-xs text-slate-400 mb-6">Data yang diisi akan otomatis tersimpan di Database Google Sheets Yayasan.</p>
                    
                    <form onsubmit="handleInputData(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Sekolah</label>
                                <input type="text" id="input-nama" value="${currentUser.school}" readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-600">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">NPSN</label>
                                <input type="text" id="input-npsn" required placeholder="Contoh: 10100004" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Jenjang</label>
                                <select id="input-jenjang" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                                    <option value="TK">TK</option>
                                    <option value="SD">SD</option>
                                    <option value="SMP">SMP</option>
                                    <option value="SMA">SMA</option>
                                    <option value="SMK">SMK</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cabang</label>
                                <input type="text" id="input-cabang" required placeholder="Halim / ATS / Iswahjudi" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tahun Ajaran</label>
                                <input type="text" id="input-tahun" value="2026/2027" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                            </div>
                        </div>

                        <hr class="my-4 border-slate-100">

                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Total Siswa</label>
                                <input type="number" id="input-siswa" required placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Total Guru</label>
                                <input type="number" id="input-guru" required placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Total Rombel</label>
                                <input type="number" id="input-rombel" required placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Total DOP (Rp)</label>
                                <input type="number" id="input-dop" required placeholder="Contoh: 150000000" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Total DSP (Rp)</label>
                                <input type="number" id="input-dsp" required placeholder="Contoh: 90000000" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800">
                            </div>
                        </div>

                        <button type="submit" id="btn-submit-data" class="w-full py-3 bg-angkasa-blue hover:bg-angkasa-darkBlue text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-angkasa-blue/20 transition mt-4">
                            Simpan Data Ke Google Sheets
                        </button>
                    </form>
                </div>
            `;
        } else {
            document.getElementById('page-title').innerText = "Executive Dashboard Analitik";
            document.getElementById('page-subtitle').innerText = "Pemantauan & Analytics Data Seluruh Sekolah Angkasa";

            navContainer.innerHTML = `
                <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm bg-angkasa-orange text-white shadow-md">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>Executive Dashboard</span>
                </a>
            `;

            contentContainer.innerHTML = `
                <div class="bg-gradient-to-r from-angkasa-darkBlue to-angkasa-blue text-white p-6 rounded-2xl shadow-lg">
                    <h3 class="font-bold text-base text-white mb-1">Selamat Datang, ${currentUser.name}</h3>
                    <p class="text-xs text-slate-200">Anda berada di mode Pengurus Yayasan. Anda dapat melihat analitik dari data yang diinput oleh sekolah-sekolah.</p>
                </div>
            `;
        }

        async function handleInputData(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-data');
            btn.disabled = true;
            btn.innerText = "Menyimpan ke Google Sheets...";

            const data = {
                action: 'inputData',
                npsn: document.getElementById('input-npsn').value,
                nama: currentUser.school,
                jenjang: document.getElementById('input-jenjang').value,
                cabang: document.getElementById('input-cabang').value,
                area: 'Kodau I',
                tahun: document.getElementById('input-tahun').value,
                siswa: document.getElementById('input-siswa').value,
                guru: document.getElementById('input-guru').value,
                rombel: document.getElementById('input-rombel').value,
                dop: document.getElementById('input-dop').value,
                dsp: document.getElementById('input-dsp').value
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                alert("Data Sekolah Berhasil Disimpan ke Google Sheets!");
            } catch (err) {
                alert("Gagal menyimpan data.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Simpan Data Ke Google Sheets";
            }
        }

        function handleLogout() {
            localStorage.removeItem('angkasa_user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
