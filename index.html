<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Informasi Data SMP Angkasa (SIDSA)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const currentSession = JSON.parse(localStorage.getItem('sidsa_session_v10'));
    if (!currentSession) {
      window.location.href = 'login.html';
    }

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0052cc',
              blueDark: '#003d99',
              blueLight: '#e6f0ff',
              orange: '#ffab00',
              grayBg: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-grayBg font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="bg-brand-blue text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-2 rounded-lg text-brand-blue font-bold text-xl shadow">
          <i data-lucide="graduation-cap" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight tracking-wide">SIDSA</h1>
          <p class="text-xs text-blue-200">Sistem Informasi Data SMP Angkasa</p>
        </div>
      </div>

      <div class="flex items-center gap-3" id="topHeaderRightControls"></div>
    </div>
  </header>

  <div class="flex flex-1 max-w-7xl w-full mx-auto px-4 py-6 gap-6">

    <aside class="w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 hidden md:block">
      <div class="mb-4 px-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Menu Utama</div>
      <nav class="space-y-1" id="sidebarMenu"></nav>
    </aside>

    <main class="flex-1 space-y-6 overflow-hidden">

      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-3" id="filterControlsContainer"></div>

        <div class="flex items-center gap-2">
          <button onclick="syncFromGoogleSheets()" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition" title="Sinkron Data Cloud">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sinkron Cloud
          </button>
          <button onclick="exportToExcel()" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
          </button>
          <button onclick="window.print()" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition">
            <i data-lucide="printer" class="w-4 h-4"></i> Cetak / PDF
          </button>
        </div>
      </div>

      <div id="pageContent"></div>

    </main>
  </div>

  <div id="addTaModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <i data-lucide="calendar-plus" class="w-4 h-4 text-brand-blue"></i> Tambah Tahun Ajaran Baru
        </h3>
        <button onclick="closeAddTaModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleAddNewTA(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-600 mb-1">Tahun Ajaran Baru</label>
          <input type="text" id="newTaInput" required placeholder="Contoh: 2027/2028" class="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-brand-blue font-semibold">
        </div>
        <div class="flex justify-end gap-2 border-t pt-3">
          <button type="button" onclick="closeAddTaModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-2 rounded-lg">Batal</button>
          <button type="submit" class="bg-brand-blue hover:bg-brand-blueDark text-white font-bold px-4 py-2 rounded-lg shadow">Tambah Tahun Ajaran</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // URL WEB APP TERBARU
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP77FqMcZMJnlmSijxQ0pXWMUR1vFJxD7p3j3hMcqaHh9hS_bP-ZXGbr9Je7NUNQ47/exec";

    const docsConfig = [
      { key: 'rkas', label: 'RKAS' },
      { key: 'rpss', label: 'RPSS' },
      { key: 'raporPendidikan', label: 'Rapor Pendidikan Sekolah' },
      { key: 'mpls', label: 'Hasil Laporan MPLS' },
      { key: 'kaldik', label: 'Kalender Pendidikan Sekolah' },
      { key: 'sarpras', label: 'Data Sarana dan Prasarana' },
      { key: 'medsos', label: 'Laporan Perkembangan Media Sosial' },
      { key: 'jadwalPelajaran', label: 'Jadwal Pelajaran' },
      { key: 'skPembagianTugas', label: 'SK Pembagian Tugas' }
    ];

    const initialData = { "2026/2027": [] };

    let activeTab = 'identitas';
    let db = JSON.parse(localStorage.getItem('sidsa_db_v10')) || initialData;

    if (!db["2026/2027"]) db["2026/2027"] = [];

    function saveDB() {
      localStorage.setItem('sidsa_db_v10', JSON.stringify(db));
    }

    async function syncFromGoogleSheets() {
      try {
        const response = await fetch(SCRIPT_URL + "?action=fetch_data");
        const json = await response.json();
        if (json.status === "success" && json.data && Object.keys(json.data).length > 0) {
          db = json.data;
          saveDB();
          renderFilterControls();
          renderPage(activeTab);
          alert("Data berhasil disinkronkan dari Google Sheets!");
        }
      } catch (err) {
        console.error("Gagal ambil data Sheets:", err);
      }
    }

    async function sendSchoolDataToCloud(schoolData) {
      const taList = Object.keys(db).sort().reverse();
      const ta = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";

      const payload = {
        action: "save_school_data",
        ta: ta,
        npsn: schoolData.npsn,
        nama: schoolData.nama,
        cabang: schoolData.cabang,
        kepalaSekolah: schoolData.kepalaSekolah || "",
        akreditasi: schoolData.akreditasi || "A",
        skPendirian: schoolData.legalitas?.skPendirian || "",
        tglSK: schoolData.legalitas?.tglSK || "",
        k7L: schoolData.siswa?.k7L || 0, k7P: schoolData.siswa?.k7P || 0, r7: schoolData.siswa?.r7 || 0,
        k8L: schoolData.siswa?.k8L || 0, k8P: schoolData.siswa?.k8P || 0, r8: schoolData.siswa?.r8 || 0,
        k9L: schoolData.siswa?.k9L || 0, k9P: schoolData.siswa?.k9P || 0, r9: schoolData.siswa?.r9 || 0,
        pL: schoolData.pendidik?.L || 0, pP: schoolData.pendidik?.P || 0, gty: schoolData.pendidik?.gty || 0, cgty: schoolData.pendidik?.cgty || 0, dpkPns: schoolData.pendidik?.dpkPns || 0,
        tL: schoolData.tendik?.L || 0, tP: schoolData.tendik?.P || 0, kty: schoolData.tendik?.kty || 0, ckty: schoolData.tendik?.ckty || 0,
        dopUmum7: schoolData.keuangan?.dopUmum7 || 0, dopUmum8: schoolData.keuangan?.dopUmum8 || 0, dopUmum9: schoolData.keuangan?.dopUmum9 || 0,
        dopTniau7: schoolData.keuangan?.dopTniau7 || 0, dopTniau8: schoolData.keuangan?.dopTniau8 || 0, dopTniau9: schoolData.keuangan?.dopTniau9 || 0,
        dspGel1: schoolData.keuangan?.dspGel1 || 0, dspGel2: schoolData.keuangan?.dspGel2 || 0, dspGel3: schoolData.keuangan?.dspGel3 || 0,
        statusValidation: schoolData.statusValidation || "Belum Mengisi"
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Gagal simpan ke cloud:", err);
      }
    }

    function resetDataDemo() {
      if (confirm("Reset akan mengembalikan database lokal ke kosong. Lanjutkan?")) {
        localStorage.removeItem('sidsa_db_v10');
        localStorage.removeItem('sidsa_users_v10');
        localStorage.removeItem('sidsa_session_v10');
        window.location.href = 'login.html';
      }
    }

    function handleLogout() {
      if (confirm("Apakah Anda yakin ingin keluar?")) {
        localStorage.removeItem('sidsa_session_v10');
        window.location.href = 'login.html';
      }
    }

    function parseRoleInfo() {
      if (currentSession.role === 'SEKOLAH') return { role: 'SEKOLAH', npsn: currentSession.npsn };
      return { role: currentSession.role, npsn: null };
    }

    function renderHeaderControls() {
      const container = document.getElementById('topHeaderRightControls');
      const isAdmin = currentSession.role === 'ADMIN';

      container.innerHTML = `
        ${isAdmin ? `
          <button onclick="resetDataDemo()" class="text-xs font-semibold bg-blue-800 hover:bg-blue-700 text-blue-200 hover:text-white px-2.5 py-1.5 rounded-lg border border-blue-400/30 transition flex items-center gap-1">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Database
          </button>
        ` : ''}
        <div class="bg-blue-900/60 px-3 py-1.5 rounded-lg border border-blue-400/30 text-xs flex items-center gap-2">
          <i data-lucide="user-check" class="w-4 h-4 text-brand-orange"></i>
          <div>
            <span class="font-bold block">${currentSession.nama}</span>
            <span class="text-[10px] text-blue-200 block">${currentSession.role === 'SEKOLAH' ? `Sekolah (NPSN: ${currentSession.npsn})` : currentSession.role}</span>
          </div>
        </div>
        <button onclick="handleLogout()" class="text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar
        </button>
      `;
    }

    window.onload = function() {
      renderHeaderControls();
      renderSidebar();
      renderFilterControls();
      renderPage('identitas');
      syncFromGoogleSheets();
      lucide.createIcons();
    };

    const menuItems = [
      { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'identitas', label: 'Identitas & Legalitas', icon: 'school', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'peserta_didik', label: 'Peserta Didik & Rombel', icon: 'users', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'pendidik_tendik', label: 'Pendidik & Tendik', icon: 'user-check', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'keuangan', label: 'Data Keuangan', icon: 'wallet', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'dokumen_tambahan', label: 'Dokumen & Laporan', icon: 'file-text', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] },
      { id: 'pengaturan_password', label: 'Ubah Password Akun', icon: 'key-round', roles: ['ADMIN', 'SEKOLAH', 'VIEWER'] }
    ];

    function renderSidebar() {
      const container = document.getElementById('sidebarMenu');
      container.innerHTML = '';
      const { role } = parseRoleInfo();

      menuItems.forEach(item => {
        if (item.roles.includes(role)) {
          const isActive = activeTab === item.id;
          const btn = document.createElement('button');
          btn.onclick = () => { activeTab = item.id; renderSidebar(); renderPage(item.id); };
          btn.className = `w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-xs font-bold transition ${
            isActive ? 'bg-brand-blue text-white shadow' : 'text-slate-600 hover:bg-slate-100'
          }`;
          btn.innerHTML = `<i data-lucide="${item.icon}" class="w-4 h-4"></i> <span>${item.label}</span>`;
          container.appendChild(btn);
        }
      });
      lucide.createIcons();
    }

    function renderFilterControls() {
      const container = document.getElementById('filterControlsContainer');
      const { role, npsn } = parseRoleInfo();
      const isAdmin = role === 'ADMIN';

      const taList = Object.keys(db).sort().reverse();
      const selectedTA = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";
      const taOptionsHtml = taList.map(ta => `<option value="${ta}" ${ta === selectedTA ? 'selected' : ''}>${ta}</option>`).join('');

      if (role === 'SEKOLAH') {
        container.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Tahun Ajaran</label>
            <select id="filterTA" onchange="applyFilters()" class="text-xs font-semibold border border-slate-300 rounded-md p-2 bg-slate-50 focus:ring-2 focus:ring-brand-blue outline-none">
              ${taOptionsHtml}
            </select>
          </div>
          <div class="self-end pb-2">
            <span class="text-xs font-bold bg-blue-100 text-brand-blue px-3 py-1.5 rounded-md border border-blue-200">
              Akses Terkunci: ${currentSession.nama}
            </span>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Tahun Ajaran</label>
            <div class="flex items-center gap-2">
              <select id="filterTA" onchange="applyFilters()" class="text-xs font-semibold border border-slate-300 rounded-md p-2 bg-slate-50 focus:ring-2 focus:ring-brand-blue outline-none">
                ${taOptionsHtml}
              </select>
              ${isAdmin ? `
                <button onclick="openAddTaModal()" class="text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-2 rounded-md shadow transition flex items-center gap-1">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> TA Baru
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function openAddTaModal() { document.getElementById('addTaModal').classList.remove('hidden'); }
    function closeAddTaModal() { document.getElementById('addTaModal').classList.add('hidden'); document.getElementById('newTaInput').value = ''; }

    function handleAddNewTA(e) {
      e.preventDefault();
      const newTA = document.getElementById('newTaInput').value.trim();
      if (!newTA || db[newTA]) return;

      db[newTA] = [];
      saveDB();
      closeAddTaModal();
      renderFilterControls();
      document.getElementById('filterTA').value = newTA;
      applyFilters();
    }

    function applyFilters() { renderPage(activeTab); }

    function getFilteredData() {
      const taList = Object.keys(db).sort().reverse();
      const ta = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";
      if (!db[ta]) db[ta] = [];

      let list = db[ta];
      const { role, npsn } = parseRoleInfo();

      if (role === 'SEKOLAH') {
        let schoolData = list.find(s => s.npsn === npsn);
        if (!schoolData) {
          schoolData = {
            npsn: npsn,
            nama: currentSession.nama,
            cabang: "LANUD",
            akreditasi: "A",
            tahunAkreditasi: "2024",
            kepalaSekolah: "",
            statusValidation: "Belum Mengisi",
            legalitas: { skPendirian: "-", tglSK: "-" },
            siswa: { k7L: 0, k7P: 0, r7: 0, k8L: 0, k8P: 0, r8: 0, k9L: 0, k9P: 0, r9: 0 },
            pendidik: { L: 0, P: 0, gty: 0, cgty: 0, dpkPns: 0 },
            tendik: { L: 0, P: 0, kty: 0, ckty: 0 },
            keuangan: { dopUmum7: 0, dopUmum8: 0, dopUmum9: 0, dopTniau7: 0, dopTniau8: 0, dopTniau9: 0, dspGel1: 0, dspGel2: 0, dspGel3: 0 },
            dokumenLaporan: {}
          };
          list.push(schoolData);
          saveDB();
        }
        return [schoolData];
      }
      return list;
    }

    function formatRupiah(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
    }

    function renderStatusBadge(status) {
      if (status === 'Sudah Valid' || status === 'Valid') {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300"><i data-lucide="check-circle" class="w-3 h-3 text-emerald-600"></i> Valid</span>`;
      } else if (status === 'Perlu Perbaikan' || status === 'Belum Mengisi') {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-300"><i data-lucide="alert-triangle" class="w-3 h-3 text-rose-600"></i> ${status}</span>`;
      } else {
        return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300"><i data-lucide="clock" class="w-3 h-3 text-amber-600"></i> ${status}</span>`;
      }
    }

    function renderPage(page) {
      const container = document.getElementById('pageContent');
      const list = getFilteredData();

      if (page === 'dashboard') {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-xl border border-slate-200 space-y-4">
            <h3 class="font-bold text-slate-800 text-base">Dashboard Utama SIDSA</h3>
            <p class="text-xs text-slate-500">Selamat datang di Sistem Informasi Data SMP Angkasa. Silakan gunakan menu di sebelah kiri untuk mengisi dan mengelola data sekolah.</p>
          </div>
        `;
      } else if (page === 'identitas') {
        container.innerHTML = renderIdentitasModule(list);
      } else if (page === 'peserta_didik') {
        container.innerHTML = renderPesertaDidikModule(list);
      } else if (page === 'pendidik_tendik') {
        container.innerHTML = renderPendidikTendikModule(list);
      } else if (page === 'keuangan') {
        container.innerHTML = renderKeuanganModule(list);
      } else if (page === 'dokumen_tambahan') {
        container.innerHTML = renderDokumenTambahanModule(list);
      } else if (page === 'pengaturan_password') {
        container.innerHTML = renderPengaturanPasswordModule();
      }
      lucide.createIcons();
    }

    // 1. MODUL IDENTITAS
    function renderIdentitasModule(list) {
      const { role } = parseRoleInfo();
      const isSekolah = role === 'SEKOLAH';

      return `
        <div class="bg-white rounded-xl border p-5 space-y-4 shadow-sm">
          <h3 class="font-bold text-slate-800 text-base border-b pb-2">Identitas & Legalitas Sekolah</h3>
          ${list.map(s => `
            <div class="border rounded-lg p-4 bg-slate-50 space-y-4">
              <h4 class="font-bold text-brand-blue text-sm">${s.nama} (NPSN: ${s.npsn})</h4>${isSekolah ? `
                <form onsubmit="saveIdentitasData(event, '${s.npsn}')" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                  <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nama Kepala Sekolah</label>
                    <input type="text" id="id_kepsek_${s.npsn}" value="${s.kepalaSekolah || ''}" required placeholder="Masukkan nama Kepala Sekolah" class="w-full p-2 border rounded-md bg-white focus:ring-2 focus:ring-brand-blue outline-none font-medium">
                  </div>
                  <div>
                    <label class="block font-semibold text-slate-600 mb-1">Akreditasi</label>
                    <select id="id_akreditasi_${s.npsn}" class="w-full p-2 border rounded-md bg-white focus:ring-2 focus:ring-brand-blue outline-none font-medium">
                      <option value="A" ${s.akreditasi === 'A' ? 'selected' : ''}>A (Predikat Unggul)</option>
                      <option value="B" ${s.akreditasi === 'B' ? 'selected' : ''}>B (Predikat Sangat Baik)</option>
                      <option value="C" ${s.akreditasi === 'C' ? 'selected' : ''}>C (Predikat Baik)</option>
                    </select>
                  </div>
                  <div>
                    <label class="block font-semibold text-slate-600 mb-1">Nomor SK Pendirian</label>
                    <input type="text" id="id_sk_${s.npsn}" value="${s.legalitas?.skPendirian || ''}" required placeholder="Masukkan nomor SK pendirian" class="w-full p-2 border rounded-md bg-white focus:ring-2 focus:ring-brand-blue outline-none font-medium">
                  </div>
                  <div>
                    <label class="block font-semibold text-slate-600 mb-1">Tanggal SK Pendirian</label>
                    <input type="date" id="id_tglsk_${s.npsn}" value="${s.legalitas?.tglSK || ''}" class="w-full p-2 border rounded-md bg-white focus:ring-2 focus:ring-brand-blue outline-none font-medium">
                  </div>
                  <div class="md:col-span-2 text-right">
                    <button type="submit" class="bg-brand-blue hover:bg-brand-blueDark text-white font-bold px-4 py-2 rounded-lg shadow text-xs">
                      Simpan Data & Sinkron Cloud
                    </button>
                  </div>
                </form>
              ` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    async function saveIdentitasData(e, npsn) {
      e.preventDefault();
      const taList = Object.keys(db).sort().reverse();
      const ta = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";
      const school = db[ta].find(s => s.npsn === npsn);
      if (school) {
        school.kepalaSekolah = document.getElementById(`id_kepsek_${npsn}`).value;
        school.akreditasi = document.getElementById(`id_akreditasi_${npsn}`).value;
        if (!school.legalitas) school.legalitas = {};
        school.legalitas.skPendirian = document.getElementById(`id_sk_${npsn}`).value;
        school.legalitas.tglSK = document.getElementById(`id_tglsk_${npsn}`).value;
        school.statusValidation = "Menunggu Validasi";
        saveDB();

        await sendSchoolDataToCloud(school);
        alert("Data Identitas Sekolah Berhasil Disimpan & Tersimpan di Cloud!");
        renderPage('identitas');
      }
    }

    // 2. MODUL PESERTA DIDIK
    function renderPesertaDidikModule(list) {
      const { role } = parseRoleInfo();
      const isSekolah = role === 'SEKOLAH';

      return `
        <div class="bg-white rounded-xl border p-5 space-y-4 shadow-sm">
          <h3 class="font-bold text-slate-800 text-base border-b pb-2">Peserta Didik & Rombongan Belajar (Rombel)</h3>
          ${list.map(s => `
            <div class="border rounded-lg p-4 bg-slate-50 space-y-4">

    async function uploadDocFile(npsn, docKey, inputElem) {
      const file = inputElem.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Data = e.target.result.split(',')[1];
        const taList = Object.keys(db).sort().reverse();
        const ta = document.getElementById('filterTA')?.value || taList[0] || "2026/2027";

        alert("Mengunggah berkas ke Google Drive...");

        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "upload_file",
              ta: ta,
              npsn: npsn,
              docKey: docKey,
              fileName: file.name,
              mimeType: file.type,
              fileData: base64Data
            })
          });

          const school = db[ta].find(s => s.npsn === npsn);
          if (school) {
            if (!school.dokumenLaporan) school.dokumenLaporan = {};
            school.dokumenLaporan[docKey] = { status: "Menunggu Validasi", fileName: file.name };
            saveDB();
            alert("Berkas Berhasil Diunggah ke Google Drive!");
            renderPage('dokumen_tambahan');
          }
        } catch (err) {
          alert("Gagal mengunggah berkas. Coba lagi.");
        }
      };
      reader.readAsDataURL(file);
    }

    function handleUpdatePassword(e) {
      e.preventDefault();
      const oldPass = document.getElementById('oldPassword').value.trim();
      const newPass = document.getElementById('newPassword').value.trim();
      const confirmPass = document.getElementById('confirmNewPassword').value.trim();

      if (oldPass !== currentSession.pass) { alert("Kata sandi lama salah!"); return; }
      if (newPass !== confirmPass) { alert("Konfirmasi kata sandi baru tidak cocok!"); return; }

      let usersDB = JSON.parse(localStorage.getItem('sidsa_users_v10')) || [];
      const userIdx = usersDB.findIndex(u => u.user.toLowerCase() === currentSession.user.toLowerCase());
      if (userIdx !== -1) {
        usersDB[userIdx].pass = newPass;
        localStorage.setItem('sidsa_users_v10', JSON.stringify(usersDB));
        currentSession.pass = newPass;
        localStorage.setItem('sidsa_session_v10', JSON.stringify(currentSession));
        alert("Kata sandi berhasil diperbarui!");
        renderPage('dashboard');
      }
    }
