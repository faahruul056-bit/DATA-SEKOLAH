<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Informasi Data SMP Angkasa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0052cc',
              blueDark: '#003d99',
              blueLight: '#e6f0ff',
              orange: '#ffab00'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- HEADER APP -->
    <div class="bg-brand-blue p-6 text-white text-center space-y-2">
      <div class="inline-flex bg-white p-3 rounded-xl text-brand-blue shadow">
        <i data-lucide="graduation-cap" class="w-8 h-8"></i>
      </div>
      <h1 class="text-xl font-black tracking-wide">SIDSA</h1>
      <p class="text-xs text-blue-200">Sistem Informasi Data SMP Angkasa</p>
    </div>

    <!-- TAB SWITCHER -->
    <div class="flex border-b border-slate-200 text-xs font-bold bg-slate-50">
      <button id="tabBtnLogin" onclick="switchTab('login')" class="flex-1 py-3 text-center border-b-2 border-brand-blue text-brand-blue font-bold">
        Masuk / Login
      </button>
      <button id="tabBtnRegister" onclick="switchTab('register')" class="flex-1 py-3 text-center text-slate-400 hover:text-slate-600 font-bold">
        Buat Akun Sekolah
      </button>
    </div>

    <div class="p-6">
      <!-- FORM LOGIN -->
      <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Username / NPSN Sekolah</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
            <input type="text" id="loginUser" required placeholder="Masukkan username / NPSN sekolah" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-blue outline-none font-medium">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Kata Sandi (Password)</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
            <input type="password" id="loginPass" required placeholder="Masukkan password" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-blue outline-none font-medium">
          </div>
        </div>

        <button type="submit" id="btnLoginSubmit" class="w-full bg-brand-blue hover:bg-brand-blueDark text-white font-bold py-2.5 rounded-lg text-xs shadow transition">
          Masuk ke Aplikasi
        </button>
      </form>

      <!-- FORM REGISTRASI SEKOLAH -->
      <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-3 hidden">
        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-2.5 rounded-lg text-[11px] flex items-center gap-1.5">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-amber-600"></i>
          <span><strong>Perhatian:</strong> Registrasi pendaftaran ini hanya bisa dilakukan satu kali.</span>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Pilih Sekolah</label>
          <select id="regSchoolSelect" onchange="autofillSchoolDetails()" required class="w-full p-2 border border-slate-300 rounded-lg text-xs outline-none bg-white font-medium">
            <option value="">-- Pilih Sekolah --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nama Lanud</label>
          <input type="text" id="regCabang" readonly placeholder="Otomatis terisi sesuai sekolah" class="w-full p-2 border border-slate-200 rounded-lg text-xs bg-slate-100 font-semibold text-slate-700 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nomor Pokok Sekolah Nasional (NPSN)</label>
          <input type="text" id="regNpsn" required placeholder="Masukkan NPSN Sekolah (contoh: 20100001)" class="w-full p-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-blue outline-none font-medium">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Buat Kata Sandi (Password)</label>
          <input type="password" id="regPass" required placeholder="Buat password untuk akun sekolah" class="w-full p-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-blue outline-none font-medium">
        </div>

        <button type="submit" id="btnRegSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-xs shadow transition">
          Daftarkan Akun Sekolah
        </button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const API_URL = "https://script.google.com/macros/s/AKfycbxOkf1R6Ucym4SXX2cqNwh0rzs05wxgdNcomND4cjyOZlPosoW6D75fMUTh5hn8isw/exec";

    const masterSekolahList = [
      { id: 'S01', nama: 'SMP ANGKASA SOEWONDO MEDAN', lanud: 'LANUD SOEWONDO MEDAN' },
      { id: 'S02', nama: 'SMP ANGKASA SUTAN SJAHRIR', lanud: 'LANUD SUTAN SJAHRIR' },
      { id: 'S03', nama: 'SMP ANGKASA BUN YAMIN', lanud: 'LANUD BUN YAMIN' },
      { id: 'S04', nama: 'SMP ANGKASA HALIM P.K JAKARTA', lanud: 'LANUD HALIM P.K JAKARTA' },
      { id: 'S05', nama: 'SMP ANGKASA ATANG SENDJAJA BOGOR', lanud: 'LANUD ATANG SENDJAJA BOGOR' },
      { id: 'S06', nama: 'SMP ANGKASA HUSEIN SASTRANEGARA BANDUNG', lanud: 'LANUD HUSEIN SASTRANEGARA BANDUNG' },
      { id: 'S07', nama: 'SMP ANGKASA HASANUDDIN MAKASSAR', lanud: 'LANUD HASANUDDIN MAKASSAR' },
      { id: 'S08', nama: 'SMP ANGKASA ABD. SALEH MALANG', lanud: 'LANUD ABD. SALEH MALANG' },
      { id: 'S09', nama: 'SMP ANGKASA EL TARI', lanud: 'LANUD EL TARI' },
      { id: 'S10', nama: 'SMP ANGKASA PATTIMURA', lanud: 'LANUD PATTIMURA' },
      { id: 'S11', nama: 'SMP ANGKASA MANUHUA BIAK', lanud: 'LANUD MANUHUA BIAK' },
      { id: 'S12', nama: 'MTs ANGKASA LEO WATTIMENA MOROTAI', lanud: 'LANUD LEO WATTIMENA MOROTAI' },
      { id: 'S13', nama: 'SMP ANGKASA SULAIMAN', lanud: 'LANUD SULAIMAN' },
      { id: 'S14', nama: 'SMP ANGKASA ADI SOEMARMO SOLO', lanud: 'LANUD ADI SOEMARMO SOLO' },
      { id: 'S15', nama: 'SMP ANGKASA ADI SUTJIPTO YOGYAKARTA', lanud: 'LANUD ADI SUTJIPTO YOGYAKARTA' }
    ];

    const defaultUsers = [
      { user: 'admin', pass: 'admin123', role: 'ADMIN', nama: 'Admin Pusat' },
      { user: 'pimpinan', pass: 'pimpinan123', role: 'VIEWER', nama: 'Pimpinan' }
    ];

    if (!localStorage.getItem('sidsa_users_v10')) {
      localStorage.setItem('sidsa_users_v10', JSON.stringify(defaultUsers));
    }

    window.onload = function() {
      const selectElem = document.getElementById('regSchoolSelect');
      masterSekolahList.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.innerText = s.nama;
        selectElem.appendChild(opt);
      });
    };

    function autofillSchoolDetails() {
      const selectedId = document.getElementById('regSchoolSelect').value;
      const school = masterSekolahList.find(s => s.id === selectedId);
      document.getElementById('regCabang').value = school ? school.lanud : '';
    }

    function switchTab(tab) {
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');
      const tabBtnLogin = document.getElementById('tabBtnLogin');
      const tabBtnRegister = document.getElementById('tabBtnRegister');

      if (tab === 'login') {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        tabBtnLogin.className = "flex-1 py-3 text-center border-b-2 border-brand-blue text-brand-blue font-bold";
        tabBtnRegister.className = "flex-1 py-3 text-center text-slate-400 hover:text-slate-600 font-bold";
      } else {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        tabBtnRegister.className = "flex-1 py-3 text-center border-b-2 border-brand-blue text-brand-blue font-bold";
        tabBtnLogin.className = "flex-1 py-3 text-center text-slate-400 hover:text-slate-600 font-bold";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const uVal = document.getElementById('loginUser').value.trim();
      const pVal = document.getElementById('loginPass').value.trim();
      const btn = document.getElementById('btnLoginSubmit');

      btn.innerText = "Memeriksa...";
      btn.disabled = true;

      try {
        let usersDB = JSON.parse(localStorage.getItem('sidsa_users_v10')) || defaultUsers;

        const res = await fetch(`${API_URL}?action=getUsers`);
        const remoteUsers = await res.json();

        if (Array.isArray(remoteUsers) && remoteUsers.length > 0) {
          usersDB = remoteUsers;
          localStorage.setItem('sidsa_users_v10', JSON.stringify(usersDB));
        }

        const found = usersDB.find(u => (u.user && u.user.toLowerCase() === uVal.toLowerCase()) && u.pass === pVal);

        if (found) {
          localStorage.setItem('sidsa_session_v10', JSON.stringify(found));
          alert(`Login Berhasil! Selamat datang, ${found.nama}`);
          window.location.href = 'index.html';
        } else {
          alert("Username/NPSN atau Kata Sandi salah. Silakan periksa kembali!");
        }
      } catch (err) {
        const usersDB = JSON.parse(localStorage.getItem('sidsa_users_v10')) || defaultUsers;
        const found = usersDB.find(u => (u.user && u.user.toLowerCase() === uVal.toLowerCase()) && u.pass === pVal);

        if (found) {
          localStorage.setItem('sidsa_session_v10', JSON.stringify(found));
          alert(`Login Berhasil (Mode Offline)! Selamat datang, ${found.nama}`);
          window.location.href = 'index.html';
        } else {
          alert("Username/NPSN atau Kata Sandi salah.");
        }
      } finally {
        btn.innerText = "Masuk ke Aplikasi";
        btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const schoolId = document.getElementById('regSchoolSelect').value;
      const npsn = document.getElementById('regNpsn').value.trim();
      const pass = document.getElementById('regPass').value.trim();
      const btn = document.getElementById('btnRegSubmit');

      if (!schoolId || !npsn || !pass) {
        alert("Lengkapi semua isian registrasi!");
        return;
      }

      const school = masterSekolahList.find(s => s.id === schoolId);
      let usersDB = JSON.parse(localStorage.getItem('sidsa_users_v10')) || defaultUsers;

      if (usersDB.find(u => u.schoolId === schoolId || u.user === npsn)) {
        alert(`Pendaftaran Gagal!\n\n${school.nama} atau NPSN (${npsn}) sudah terdaftar sebelumnya.`);
        return;
      }

      btn.innerText = "Mendaftarkan...";
      btn.disabled = true;

      const newUser = {
        action: "saveUser",
        user: npsn,
        pass: pass,
        role: 'SEKOLAH',
        npsn: npsn,
        schoolId: schoolId,
        nama: school.nama
      };

      usersDB.push(newUser);
      localStorage.setItem('sidsa_users_v10', JSON.stringify(usersDB));

      try {
        fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(newUser)
        });
      } catch (err) {
        console.error("Gagal kirim ke Google Sheets:", err);
      }

      alert(`Registrasi ${school.nama} Berhasil!\n\nSilakan Login menggunakan NPSN (${npsn}) dan Kata Sandi baru.`);
      switchTab('login');
      document.getElementById('loginUser').value = npsn;
      btn.innerText = "Daftarkan Akun Sekolah";
      btn.disabled = false;
    }
  </script>
</body>
</html>
