<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Data Sekolah Angkasa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        angkasa: {
                            blue: '#0F4C81',
                            darkBlue: '#0A3459',
                            orange: '#F58220',
                            orangeHover: '#d96f16'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
        
        <!-- Header Card -->
        <div class="bg-gradient-to-r from-angkasa-darkBlue to-angkasa-blue p-8 text-white text-center relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/5 rounded-full blur-xl"></div>
            
            <div class="inline-flex p-3 bg-angkasa-orange rounded-2xl text-white shadow-lg shadow-angkasa-orange/30 mb-3">
                <i data-lucide="graduation-cap" class="w-8 h-8"></i>
            </div>
            <h1 class="font-extrabold text-lg uppercase tracking-wider">Sistem Informasi</h1>
            <p class="text-xs text-amber-400 font-bold tracking-widest uppercase">DATA SEKOLAH ANGKASA</p>
            <p class="text-[11px] text-slate-300 mt-2">Portal Akses Pengelolaan & Analitik Data Sekolah</p>
        </div>

        <!-- Form Login -->
        <div class="p-8">
            <div id="error-alert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs font-semibold flex items-center space-x-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                <span id="error-text">Username atau password salah!</span>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username / NPSN</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="username" required placeholder="Masukkan NPSN / Username" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-angkasa-blue focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-angkasa-blue focus:bg-white transition">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center space-x-2 text-slate-600 cursor-pointer">
                        <input type="checkbox" class="rounded border-slate-300 text-angkasa-blue focus:ring-0">
                        <span>Ingat saya</span>
                    </label>
                    <a href="#" onclick="alert('Silakan hubungi Pengurus Yayasan Angkasa untuk reset password.')" class="font-semibold text-angkasa-orange hover:underline">Lupa Password?</a>
                </div>

                <button type="submit" class="w-full py-3 bg-angkasa-orange hover:bg-angkasa-orangeHover text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-angkasa-orange/20 transition duration-200 flex items-center justify-center space-x-2">
                    <span>Masuk ke Dashboard</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <p class="text-[11px] text-slate-400 font-medium">Pengelola Data Sekolah Yayasan Angkasa</p>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('error-alert');

            // Simulasi Login Akses (Bisa Dikembangkan)
            if (user === 'admin' && pass === 'admin123') {
                localStorage.setItem('angkasa_user', JSON.stringify({ name: 'Administrator', role: 'Yayasan Angkasa', npsn: 'ALL' }));
                window.location.href = 'index.html';
            } else if (user === '10100004' && pass === '10100004') {
                localStorage.setItem('angkasa_user', JSON.stringify({ name: 'SMA Angkasa Halim', role: 'Operator Sekolah', npsn: '10100004' }));
                window.location.href = 'index.html';
            } else {
                errorAlert.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
